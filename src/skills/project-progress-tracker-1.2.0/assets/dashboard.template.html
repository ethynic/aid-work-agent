<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多项目进度看板</title>
<style>
:root{
  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#fafbfe; --border:#e4e9f2; --border-2:#eef1f7;
  --text:#1b2437; --text-2:#4a5670; --muted:#7b879e; --primary:#3b5bdb; --primary-soft:#eef2ff;
  --ok:#16a34a; --ok-soft:#e9f7ee; --warn:#e2930b; --warn-soft:#fff5e2; --bad:#e0484d; --bad-soft:#fdecec;
  --shadow:0 1px 2px rgba(20,32,60,.04),0 8px 24px rgba(20,32,60,.06); --shadow-lg:0 12px 40px rgba(20,32,60,.14);
  --radius:14px;
}
[data-theme="dark"]{
  --bg:#0e131f; --surface:#171f2e; --surface-2:#1c2536; --border:#2a3549; --border-2:#232d40;
  --text:#e9eef8; --text-2:#b8c3d8; --muted:#8492ab; --primary:#8099ff; --primary-soft:#222c4a;
  --ok:#3ecf72; --ok-soft:#173226; --warn:#f0ad3c; --warn-soft:#3a2d16; --bad:#ff6b70; --bad-soft:#3b1f23;
  --shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.25); --shadow-lg:0 12px 40px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary);text-decoration:none}
.app{max-width:1480px;margin:0 auto;padding:0 26px 40px}
.topbar{display:flex;align-items:center;gap:18px;padding:26px 0 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:13px;margin-right:auto;min-width:260px}
.brand-mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(140deg,#3b5bdb,#6d83f2);display:grid;place-items:center;color:#fff;font-size:20px;font-weight:700;box-shadow:0 6px 16px rgba(59,91,219,.28)}
.brand h1{margin:0;font-size:20px;letter-spacing:.2px;font-weight:700}
.brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.meta-chip{font-size:12px;color:var(--text-2);background:var(--surface);border:1px solid var(--border);padding:7px 12px;border-radius:9px;white-space:nowrap}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text-2);padding:8px 13px;border-radius:9px;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:.16s;white-space:nowrap}
.btn:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-1px)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:12px}
.demo-tag{display:inline-flex;align-items:center;gap:5px;background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 28%,transparent);font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 18px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--primary))}
.kpi .k-label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .k-value{font-size:31px;font-weight:700;line-height:1.25;margin-top:6px;letter-spacing:-.5px}
.kpi .k-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.kpi.health{display:flex;align-items:center;gap:14px}
.ring{width:66px;height:66px;flex:0 0 66px}
.kpi.health .k-value{font-size:clamp(16px,1.45vw,21px);margin:0;white-space:nowrap;letter-spacing:-.6px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.summary{padding:22px 24px;margin-bottom:16px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:26px}
.summary-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.summary-head h2{margin:0;font-size:15px;font-weight:700}
.ai-tag{font-size:11px;background:var(--primary-soft);color:var(--primary);padding:3px 9px;border-radius:6px;font-weight:600}
.overall-badge{font-size:12px;font-weight:700;padding:4px 11px;border-radius:20px;background:var(--bad-soft);color:var(--bad)}
.overall-badge.lv1{background:var(--ok-soft);color:var(--ok)}
.overall-badge.lv2{background:var(--warn-soft);color:var(--warn)}
.exec-text{font-size:13.5px;color:var(--text-2);line-height:1.85;margin:0 0 14px}
.mini-title{font-size:12px;font-weight:700;color:var(--text);margin:0 0 8px;display:flex;align-items:center;gap:6px}
.list-tight{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.list-tight li{font-size:12.5px;color:var(--text-2);line-height:1.6;padding-left:16px;position:relative}
.list-tight li::before{content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--dot,var(--primary))}
.summary-side{display:grid;grid-template-columns:1fr 1fr;gap:20px;border-left:1px solid var(--border-2);padding-left:26px}
.charts{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;margin-bottom:18px}
.chart-panel{padding:18px 20px}
.chart-panel h3{margin:0 0 4px;font-size:14px;font-weight:700}
.chart-panel .hint{font-size:11.5px;color:var(--muted);margin:0 0 12px}
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut{width:140px;height:140px;flex:0 0 140px}
.donut-center{font-size:26px;font-weight:700;fill:var(--text)}
.donut-sub{font-size:9px;fill:var(--muted)}
.legend{display:flex;flex-direction:column;gap:9px;flex:1;min-width:0}
.legend-row{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-2)}
.legend-dot{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
.legend-row b{margin-left:auto;font-size:13px;color:var(--text)}
.pb-list{display:flex;flex-direction:column;gap:9px;max-height:230px;overflow-y:auto;padding-right:6px}
.pb-row{display:grid;grid-template-columns:132px minmax(0,1fr) 42px;gap:10px;align-items:center;font-size:11.5px}
.pb-name{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb-track{height:9px;border-radius:6px;background:var(--border-2);position:relative;overflow:visible}
.pb-fill{height:100%;border-radius:6px;transition:width .5s}
.pb-plan{position:absolute;top:-3px;height:15px;width:2px;background:var(--text-2);opacity:.65;border-radius:2px}
.pb-val{text-align:right;font-weight:700;color:var(--text)}
.bridge-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;font-size:12px;margin-bottom:14px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);flex-wrap:wrap;line-height:1.6}
.bridge-bar .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:0 0 8px}
.bridge-bar.online .dot{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.bridge-bar b{color:var(--text)}
.bridge-bar code{background:var(--surface-2);border:1px solid var(--border);padding:1px 5px;border-radius:4px;font-size:11px}
.bridge-bar .sp{margin-left:auto}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled:hover{border-color:var(--border);color:var(--text-2);transform:none}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);padding:4px;border-radius:11px}
.tab{border:0;background:transparent;color:var(--text-2);padding:7px 14px;border-radius:8px;font-size:12.5px;display:flex;align-items:center;gap:7px;transition:.15s}
.tab:hover{background:var(--surface-2)}
.tab.active{background:var(--primary);color:#fff;font-weight:600}
.tab .cnt{font-size:11px;opacity:.75;background:rgba(127,127,127,.16);padding:1px 6px;border-radius:10px}
.tab.active .cnt{background:rgba(255,255,255,.22);opacity:1}
.search{flex:1;min-width:190px;max-width:330px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--border);background:var(--surface);border-radius:10px;outline:none;font-size:13px}
.search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.search::before{content:"⌕";position:absolute;left:11px;top:6px;color:var(--muted);font-size:18px}
select.sel{padding:9px 11px;border:1px solid var(--border);background:var(--surface);border-radius:10px;font-size:13px;outline:none}
.result-note{margin-left:auto;font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 19px 15px;position:relative;overflow:hidden;cursor:pointer;transition:.18s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--primary) 35%,var(--border))}
.card::before{content:"";position:absolute;left:0;top:0;height:3px;width:100%;background:var(--accent)}
.card-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:11px}
.card h3{margin:0;font-size:15px;font-weight:700;line-height:1.4;flex:1}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.badge.on_track{background:var(--ok-soft);color:var(--ok)}
.badge.delayed{background:var(--warn-soft);color:var(--warn)}
.badge.overdue{background:var(--bad-soft);color:var(--bad)}
.risk-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}
.card-meta{font-size:11.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.progress-head{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
.progress-head .num{font-size:25px;font-weight:700;letter-spacing:-.5px;line-height:1}
.progress-head .unit{font-size:12px;color:var(--muted)}
.gap-tag{margin-left:auto;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px}
.gap-tag.behind{background:var(--bad-soft);color:var(--bad)}
.gap-tag.ahead{background:var(--ok-soft);color:var(--ok)}
.gap-tag.even{background:var(--surface-2);color:var(--muted)}
.dual-bar{height:8px;border-radius:5px;background:var(--border-2);position:relative;margin-bottom:5px}
.dual-bar .fill{height:100%;border-radius:5px;background:var(--accent)}
.dual-bar .plan{position:absolute;top:-3px;height:14px;width:2px;background:var(--text-2);opacity:.6}
.bar-legend{font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:13px}
.bar-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--accent);margin-right:4px}
.card-summary{font-size:12.5px;color:var(--text-2);line-height:1.65;min-height:41px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border-2);font-size:11px;color:var(--muted);flex-wrap:wrap}
.card-foot .sp{margin-left:auto}
.inbox-chip{background:var(--primary-soft);color:var(--primary);font-weight:700;padding:2px 8px;border-radius:12px;font-size:10.5px}
.card-btns{display:flex;gap:7px;margin-top:11px}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius)}
footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
/* 抽屉 / 弹窗 */
.overlay{position:fixed;inset:0;background:rgba(12,18,32,.5);opacity:0;pointer-events:none;transition:.22s;z-index:40;backdrop-filter:blur(2px)}
.overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(680px,94vw);background:var(--bg);z-index:50;transform:translateX(102%);transition:.28s cubic-bezier(.2,.8,.2,1);overflow-y:auto;box-shadow:var(--shadow-lg)}
.drawer.show{transform:translateX(0)}
.drawer-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);padding:20px 24px;z-index:2}
.drawer-head .row{display:flex;align-items:flex-start;gap:12px}
.drawer-head h2{margin:0;font-size:19px;line-height:1.4;flex:1}
.close-x{border:0;background:var(--surface-2);width:30px;height:30px;border-radius:8px;color:var(--text-2);font-size:17px;line-height:1;flex:0 0 30px}
.close-x:hover{background:var(--bad-soft);color:var(--bad)}
.drawer-body{padding:20px 24px 40px;display:flex;flex-direction:column;gap:18px}
.dblock{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:17px 19px}
.dblock h4{margin:0 0 12px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px}
.dblock h4 .tag{font-size:10px;font-weight:600;color:var(--muted);background:var(--surface-2);padding:2px 7px;border-radius:5px}
.reason{background:var(--primary-soft);border-left:3px solid var(--primary);padding:11px 14px;border-radius:0 8px 8px 0;font-size:12.5px;color:var(--text-2);line-height:1.7}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.dstat{background:var(--surface-2);border:1px solid var(--border-2);border-radius:9px;padding:10px 12px}
.dstat .l{font-size:10.5px;color:var(--muted)}
.dstat .v{font-size:17px;font-weight:700;margin-top:2px}
.dstat .v.bad{color:var(--bad)} .dstat .v.ok{color:var(--ok)}
.three-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.timeline{list-style:none;margin:0;padding:0 0 0 6px}
.timeline li{position:relative;padding:0 0 15px 22px;border-left:2px solid var(--border);font-size:12.5px}
.timeline li:last-child{border-left-color:transparent;padding-bottom:0}
.timeline li::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--tl,var(--primary))}
.timeline .t-name{font-weight:600;color:var(--text)}
.timeline .t-meta{font-size:11px;color:var(--muted);margin-top:2px}
.evidence{display:flex;flex-direction:column;gap:10px}
.ev{border:1px solid var(--border-2);background:var(--surface-2);border-radius:9px;padding:11px 13px}
.ev-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--text-2)}
.ev-type{font-size:10px;padding:1px 7px;border-radius:5px;background:var(--primary-soft);color:var(--primary);font-weight:600}
.ev-quote{margin:8px 0 0;font-size:12px;color:var(--text-2);line-height:1.7;border-left:2px solid var(--border);padding-left:10px}
.sig{font-size:10px;padding:1px 7px;border-radius:5px;font-weight:600}
.sig.blocked{background:var(--bad-soft);color:var(--bad)}
.sig.resolved{background:var(--ok-soft);color:var(--ok)}
.sig.progress{background:var(--primary-soft);color:var(--primary)}
.sig.neutral{background:var(--surface-2);color:var(--muted)}
.gap-warn{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 13px;font-size:12px;margin-top:10px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%) scale(.98);width:min(620px,94vw);max-height:88vh;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);z-index:60;opacity:0;pointer-events:none;transition:.2s}
.modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal-head{padding:20px 24px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.modal-head h3{margin:0;font-size:16px;flex:1}
.modal-body{padding:20px 24px 24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--border);background:var(--surface-2);border-radius:9px;outline:none;font-size:13px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.field textarea{min-height:112px;resize:vertical;line-height:1.6}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-note{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.6}
.file-drop{border:1.5px dashed var(--border);border-radius:10px;padding:14px;text-align:center;background:var(--surface-2);font-size:12px;color:var(--muted)}
.file-drop input{display:block;width:100%;margin-top:8px;font-size:11.5px}
.file-list{font-size:11.5px;color:var(--text-2);margin-top:8px;display:flex;flex-direction:column;gap:3px}
.modal-foot{display:flex;gap:9px;justify-content:flex-end;padding-top:6px}
.help-list{margin:0;padding-left:18px;font-size:13px;color:var(--text-2);line-height:1.9}
.help-list code{background:var(--surface-2);border:1px solid var(--border);padding:1px 5px;border-radius:4px;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:80;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.charts{grid-template-columns:1fr}.summary{grid-template-columns:1fr}.summary-side{border-left:0;border-top:1px solid var(--border-2);padding-left:0;padding-top:18px}}
@media(max-width:680px){.app{padding:0 14px 30px}.kpis{grid-template-columns:repeat(2,1fr)}.kpi.health{flex-direction:column;align-items:flex-start;gap:8px}.kpi.health .k-value{font-size:19px}.grid{grid-template-columns:1fr}.summary-side,.three-col,.dgrid{grid-template-columns:1fr 1fr}.topbar{padding-top:18px}.brand{min-width:100%}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">▤</div>
      <div>
        <h1 id="pageTitle">多项目进度看板</h1>
        <p id="pageSub">客户项目组合 · 进度健康度巡检</p>
      </div>
    </div>
    <div class="top-actions">
      <span class="meta-chip" id="asOfChip">基准日 —</span>
      <span id="demoChip"></span>
      <button class="btn ghost sm" id="themeBtn" title="切换明暗主题">◐ 主题</button>
      <button class="btn sm" id="helpBtn" title="使用说明">? 说明</button>
      <button class="btn sm" id="importBtn" title="导入 projects.json">↥ 导入数据</button>
      <button class="btn sm" id="exportBtn" title="导出当前看板数据">↧ 导出数据</button>
      <button class="btn primary sm" id="addBtn">＋ 录入项目记录</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </header>

  <main>
    <section class="kpis" id="kpis"></section>
    <section class="panel summary" id="summary"></section>
    <section class="charts">
      <div class="panel chart-panel">
        <h3>状态分布</h3><p class="hint">按 AI 研判结果统计</p>
        <div class="donut-wrap" id="donut"></div>
      </div>
      <div class="panel chart-panel">
        <h3>实际进度 vs 计划进度</h3><p class="hint">填充条＝实际完成率，竖线＝计划应达完成率</p>
        <div class="pb-list" id="progressBars"></div>
      </div>
    </section>
    <section class="bridge-bar" id="bridgeBar"></section>
    <section class="toolbar" id="toolbar"></section>
    <section class="grid" id="grid"></section>
  </main>

  <footer>
    <span id="footLeft">数据由项目进度技能生成 · 离线单文件看板</span>
    <span>状态口径：超时＝已越过计划节点未完成 · 延误＝未到期但已落后/阻塞 · 正常＝符合计划</span>
  </footer>
</div>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-label="项目详情"></aside>
<div class="modal" id="modal" aria-label="录入/说明"></div>
<div class="toast" id="toast"></div>

<script id="ppt-data" type="application/json">__DASHBOARD_DATA__</script>
<script>
"use strict";
/* ---------- 基础 ---------- */
const BOOT = JSON.parse(document.getElementById("ppt-data").textContent);
const LS = { theme:"ppt_theme", inbox:"ppt_inbox", data:"ppt_data_override" };
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const readLS = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } };
const writeLS = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ toast("本地存储不可用，本次录入仅保留在页面内"); } };

let DATA = readLS(LS.data, null) || BOOT;
let INBOX = readLS(LS.inbox, []);
let UI = { filter:"all", q:"", sort:"risk", theme: readLS(LS.theme, "light") };
let BRIDGE = { online:false, busy:false };
let openId = null;

const SM = {
  on_track:{ label:"正常", color:"var(--ok)", accent:"var(--ok)" },
  delayed:{ label:"延误", color:"var(--warn)", accent:"var(--warn)" },
  overdue:{ label:"超时", color:"var(--bad)", accent:"var(--bad)" }
};
const RM = { high:{label:"高风险",color:"var(--bad)"}, medium:{label:"中风险",color:"var(--warn)"}, low:{label:"低风险",color:"var(--ok)"} };
const TM = { report:"汇报", communication:"沟通", milestone:"里程碑", acceptance:"验收", other:"其他" };
const SIG = { blocked:"阻塞", resolved:"已解决", progress:"进展", neutral:"常规" };

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove("show"), 2600);
}
function arr(v){ return Array.isArray(v) ? v : []; }
function inboxCount(name){ return INBOX.filter(x => x.project === name).length; }
function shortName(n){ return n.length > 11 ? n.slice(0,11) + "…" : n; }
function gapOf(p){ return Math.round((p.progress||0) - (p.planned_progress||0)); }
function daysText(p){
  if (p.days_remaining == null) return "未设计划日期";
  if (p.closed) return p.days_remaining < 0 ? "结项 · 曾逾期 " + (-p.days_remaining) + " 天" : "已结项";
  if (p.days_remaining < 0) return "已逾期 " + (-p.days_remaining) + " 天";
  if (p.days_remaining === 0) return "今天到期";
  return "剩余 " + p.days_remaining + " 天";
}
function overviewLevel(s){
  if (s === "健康") return "lv1";
  if (s === "可控") return "lv2";
  return "";
}

/* ---------- 渲染：KPI ---------- */
function renderKPIs(){
  const t = DATA.meta.totals || {};
  const total = t.total || arr(DATA.projects).length || 1;
  const pctOk = Math.round(((t.on_track||0)/total)*100);
  const circ = 2 * Math.PI * 27;
  const avg = t.avg_progress || 0;
  const dash = (avg/100)*circ;
  const items = [
    { label:"跟踪项目", value:t.total||0, sub:"本期纳入组合管理", accent:"var(--primary)" },
    { label:"正常", value:t.on_track||0, sub:"占比 " + pctOk + "% · 符合计划", accent:"var(--ok)" },
    { label:"延误", value:t.delayed||0, sub:"未到期但已落后/阻塞", accent:"var(--warn)" },
    { label:"超时", value:t.overdue||0, sub:"已越过计划节点", accent:"var(--bad)" }
  ];
  let html = items.map(i =>
    '<div class="kpi" style="--accent:'+i.accent+'"><div class="k-label">'+esc(i.label)+'</div>'+
    '<div class="k-value" style="color:'+i.accent+'">'+i.value+'</div><div class="k-sub">'+esc(i.sub)+'</div></div>'
  ).join("");
  html += '<div class="kpi health" style="--accent:var(--primary)">'+
    '<svg class="ring" viewBox="0 0 66 66"><circle cx="33" cy="33" r="27" fill="none" stroke="var(--border-2)" stroke-width="7"/>'+
    '<circle cx="33" cy="33" r="27" fill="none" stroke="var(--primary)" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+dash+' '+circ+'" transform="rotate(-90 33 33)"/>'+
    '<text x="33" y="37" text-anchor="middle" font-size="13" font-weight="700" fill="var(--text)">'+Math.round(avg)+'%</text></svg>'+
    '<div><div class="k-label">平均完成率</div><div class="k-value">'+esc(DATA.meta.overall_status||"—")+'</div>'+
    '<div class="k-sub">高风险项目 '+ (t.high_risk||0) +' 个</div></div></div>';
  $("#kpis").innerHTML = html;
}

/* ---------- 渲染：AI 总体总结 ---------- */
function renderSummary(){
  const m = DATA.meta;
  const risks = arr(m.top_risks), recs = arr(m.recommendations);
  $("#summary").innerHTML =
    '<div><div class="summary-head"><span class="ai-tag">✦ AI 总体研判</span><h2>项目组合总体情况</h2>'+
    '<span class="overall-badge '+overviewLevel(m.overall_status)+'">'+esc(m.overall_status||"—")+'</span></div>'+
    '<p class="exec-text">'+esc(m.executive_summary||"暂无总体总结")+'</p>'+
    '<p class="mini-title">▸ 组合建议</p><ul class="list-tight" style="--dot:var(--primary)">'+
    (recs.length ? recs.map(r=>'<li>'+esc(r)+'</li>').join("") : '<li>暂无</li>')+'</ul></div>'+
    '<div class="summary-side"><div><p class="mini-title" style="color:var(--bad)">● 重点风险 TOP '+risks.length+'</p>'+
    '<ul class="list-tight" style="--dot:var(--bad)">'+(risks.length?risks.map(r=>'<li>'+esc(r)+'</li>').join(""):'<li>暂无</li>')+'</ul></div>'+
    '<div><p class="mini-title" style="color:var(--primary)">● 数据概览</p>'+
    '<ul class="list-tight" style="--dot:var(--primary)">'+
    '<li>资料来源：'+esc({upload:"客户上传文件",knowledge:"知识库",mixed:"上传＋知识库",demo:"演示数据"}[m.source_mode]||m.source_mode||"—")+'</li>'+
    '<li>基准日：'+esc(m.as_of||"—")+'</li>'+
    '<li>平均完成率：'+esc((DATA.meta.totals||{}).avg_progress||0)+'%</li>'+
    '<li>高风险项目：'+esc((DATA.meta.totals||{}).high_risk||0)+' 个</li>'+
    '<li>待 AI 分析的新记录：'+INBOX.length+' 条</li></ul></div></div>';
}

/* ---------- 渲染：图表 ---------- */
function renderDonut(){
  const t = DATA.meta.totals || {}, total = t.total || 1;
  const segs = [ ["on_track", t.on_track||0, "var(--ok)"], ["delayed", t.delayed||0, "var(--warn)"], ["overdue", t.overdue||0, "var(--bad)"] ];
  const r = 54, c = 2*Math.PI*r; let off = 0;
  let circles = segs.map(([k,v,col]) => {
    const len = (v/total)*c;
    const s = '<circle cx="70" cy="70" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="18" stroke-dasharray="'+len+' '+(c-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 70 70)"/>';
    off += len; return s;
  }).join("");
  let legend = segs.map(([k,v,col]) =>
    '<div class="legend-row"><span class="legend-dot" style="background:'+col+'"></span>'+SM[k].label+'<b>'+v+'</b></div>'
  ).join("");
  $("#donut").innerHTML = '<svg class="donut" viewBox="0 0 140 140"><circle cx="70" cy="70" r="54" fill="none" stroke="var(--border-2)" stroke-width="18"/>'+circles+
    '<text class="donut-center" x="70" y="70" text-anchor="middle">'+total+'</text>'+
    '<text class="donut-sub" x="70" y="86" text-anchor="middle">PROJECTS</text></svg><div class="legend">'+legend+'</div>';
}
function renderProgressBars(){
  const ps = [...arr(DATA.projects)].sort((a,b) => gapOf(a)-gapOf(b));
  $("#progressBars").innerHTML = ps.map(p =>
    '<div class="pb-row"><div class="pb-name" title="'+esc(p.name)+'">'+esc(shortName(p.name))+'</div>'+
    '<div class="pb-track"><div class="pb-fill" style="width:'+Math.min(100,p.progress||0)+'%;background:'+SM[p.status].color+'"></div>'+
    '<div class="pb-plan" style="left:'+Math.min(100,p.planned_progress||0)+'%" title="计划 '+(p.planned_progress||0)+'%"></div></div>'+
    '<div class="pb-val">'+Math.round(p.progress||0)+'%</div></div>'
  ).join("") || '<p class="hint">暂无项目</p>';
}

/* ---------- 渲染：工具条 ---------- */
const SORTERS = {
  risk:(a,b)=> ({overdue:0,delayed:1,on_track:2}[a.status]-{overdue:0,delayed:1,on_track:2}[b.status]) || gapOf(a)-gapOf(b),
  due:(a,b)=> String(a.due_date||"9999").localeCompare(String(b.due_date||"9999")),
  progress:(a,b)=> (a.progress||0)-(b.progress||0),
  name:(a,b)=> String(a.name).localeCompare(String(b.name),"zh")
};
function visibleProjects(){
  let ps = arr(DATA.projects);
  if (UI.filter !== "all") ps = ps.filter(p => p.status === UI.filter);
  if (UI.q.trim()){
    const q = UI.q.trim().toLowerCase();
    ps = ps.filter(p => [p.name,p.client,p.owner,p.summary,p.status_reason].join(" ").toLowerCase().includes(q));
  }
  return ps.sort(SORTERS[UI.sort] || SORTERS.risk);
}
function renderToolbar(){
  const t = DATA.meta.totals || {};
  const tabs = [["all","全部",t.total||0],["overdue","超时",t.overdue||0],["delayed","延误",t.delayed||0],["on_track","正常",t.on_track||0]];
  $("#toolbar").innerHTML =
    '<div class="tabs">'+tabs.map(([k,l,n])=>'<button class="tab '+(UI.filter===k?"active":"")+'" data-filter="'+k+'">'+l+'<span class="cnt">'+n+'</span></button>').join("")+'</div>'+
    '<div class="search"><input id="searchInput" type="search" placeholder="搜索项目 / 负责人 / 客户 / 摘要" value="'+esc(UI.q)+'"></div>'+
    '<select class="sel" id="sortSel"><option value="risk">按风险排序</option><option value="due">按截止日排序</option>'+
    '<option value="progress">按完成率排序</option><option value="name">按名称排序</option></select>'+
    '<span class="result-note">显示 '+visibleProjects().length+' / '+(t.total||0)+' 个项目'+(INBOX.length?' · 待分析 '+INBOX.length+' 条':'')+'</span>'+
    '<button class="btn sm primary" id="aiBtn" '+(BRIDGE.online&&!BRIDGE.busy?'':'disabled')+' title="把新录入记录交给 AI 研判并直接刷新看板">✦ AI 一键重分析'+(INBOX.length?' ('+INBOX.length+')':'')+'</button>'+
    '<button class="btn sm" id="syncBtn" '+(BRIDGE.online?'':'disabled')+' title="拉取技能刚写入的最新研判结果">↻ 同步最新研判</button>'+
    '<button class="btn sm" id="inboxBtn">导出待分析包'+(INBOX.length?' ('+INBOX.length+')':'')+'</button>';
  $("#sortSel").value = UI.sort;
  $("#toolbar").querySelectorAll("[data-filter]").forEach(b => b.onclick = () => { UI.filter = b.dataset.filter; renderToolbar(); renderGrid(); });
  $("#searchInput").oninput = (e) => { UI.q = e.target.value; renderGrid(); const n = $(".result-note"); if(n) n.textContent = "显示 "+visibleProjects().length+" / "+(t.total||0)+" 个项目"+(INBOX.length?" · 待分析 "+INBOX.length+" 条":""); };
  $("#sortSel").onchange = (e) => { UI.sort = e.target.value; renderGrid(); };
  $("#inboxBtn").onclick = exportInbox;
  $("#aiBtn").onclick = aiAnalyze;
  $("#syncBtn").onclick = syncData;
}

/* ---------- 本地分析桥接 ---------- */
function renderBridgeBar(){
  const el = $("#bridgeBar");
  if (!el) return;
  el.className = "bridge-bar" + (BRIDGE.online ? " online" : "");
  el.innerHTML = '<span class="dot"></span>' +
    (BRIDGE.online
      ? '<span><b>已连接本地分析服务</b> · 点「✦ AI 一键重分析」，新录入的汇报/沟通记录会交给 AI 研判，结果直接刷新本页。</span>'
      : '<span><b>离线模式</b> · 启动 <code>python scripts/serve.py</code> 并从 <code>http://127.0.0.1:8765</code> 打开，可解锁一键 AI 分析；否则请导出待分析包交给技能重跑。</span>') +
    '<span class="sp"></span><span style="color:var(--muted)">导入数据＝立即替换看板 · 录入记录＝待 AI 研判后更新</span>';
}
async function probeBridge(){
  if (location.protocol === "file:"){
    BRIDGE.online = false; renderBridgeBar(); renderToolbar(); return;
  }
  try {
    const r = await fetch("/api/status", {cache:"no-store"});
    const j = await r.json();
    BRIDGE.online = !!(j && j.ok);
  } catch(e) { BRIDGE.online = false; }
  renderBridgeBar(); renderToolbar();
}
async function aiAnalyze(){
  if (!BRIDGE.online || BRIDGE.busy) return;
  BRIDGE.busy = true; renderToolbar();
  const btn = $("#aiBtn"); if (btn) btn.textContent = "✦ AI 分析中…";
  try {
    const r = await fetch("/api/analyze", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ items: INBOX, as_of: DATA.meta.as_of })
    });
    const j = await r.json();
    if (j.ok && j.mode === "api" && j.data && j.data.projects){
      DATA = j.data; writeLS(LS.data, DATA);
      INBOX = []; writeLS(LS.inbox, INBOX);
      renderAll(); toast("AI 研判完成，看板已刷新");
    } else if (j.ok && j.mode === "packet"){
      toast("证据包已生成：在对话里说「分析这批新记录」，再点「↻ 同步最新研判」");
    } else {
      toast("分析未完成：" + (j.error || "未知原因"));
    }
  } catch(e) { toast("请求失败：" + e.message); }
  finally { BRIDGE.busy = false; renderToolbar(); }
}
async function syncData(){
  try {
    const r = await fetch("/api/data", {cache:"no-store"});
    const j = await r.json();
    if (j.ok && j.data && j.data.projects){
      DATA = j.data; writeLS(LS.data, DATA); renderAll();
      toast("已同步最新研判结果（" + j.data.projects.length + " 个项目）");
    } else { toast("同步失败：" + (j.error || "无数据")); }
  } catch(e) { toast("同步失败：" + e.message); }
}

/* ---------- 渲染：项目卡片 ---------- */
function renderGrid(){
  const ps = visibleProjects();
  if (!ps.length){ $("#grid").innerHTML = '<div class="empty">没有符合条件的项目。换个筛选条件或搜索词试试。</div>'; return; }
  $("#grid").innerHTML = ps.map(p => {
    const gap = gapOf(p), sm = SM[p.status], rm = RM[p.risk_level] || RM.medium;
    const gapCls = gap <= -10 ? "behind" : (gap >= 0 ? "ahead" : "even");
    const gapTxt = gap <= -10 ? "落后 " + (-gap) + "pt" : (gap >= 0 ? "领先 " + gap + "pt" : "落后 " + (-gap) + "pt");
    const n = inboxCount(p.name);
    return '<article class="card" data-id="'+esc(p.id)+'" style="--accent:'+sm.accent+'">'+
      '<div class="card-top"><h3>'+esc(p.name)+'</h3><span class="badge '+p.status+'">'+sm.label+'</span></div>'+
      '<div class="card-meta"><span>'+esc(p.client||"未指定客户")+'</span><span>负责人 '+esc(p.owner||"—")+'</span>'+
      '<span><i class="risk-dot" style="background:'+rm.color+'"></i>'+rm.label+'</span></div>'+
      '<div class="progress-head"><span class="num" style="color:'+sm.color+'">'+Math.round(p.progress||0)+'</span><span class="unit">% 实际完成</span>'+
      '<span class="gap-tag '+gapCls+'">'+gapTxt+'</span></div>'+
      '<div class="dual-bar"><div class="fill" style="width:'+Math.min(100,p.progress||0)+'%"></div>'+
      '<div class="plan" style="left:'+Math.min(100,p.planned_progress||0)+'%"></div></div>'+
      '<div class="bar-legend"><span><i></i>实际 '+(p.progress||0)+'%</span><span>计划 '+(p.planned_progress||0)+'%</span></div>'+
      '<div class="card-summary">'+esc(p.summary||"")+'</div>'+
      '<div class="card-foot"><span>截止 '+esc(p.due_date||"—")+'</span><span>'+esc(daysText(p))+'</span>'+
      '<span>依据 '+arr(p.sources).length+' 份</span>'+(n?'<span class="inbox-chip">待分析 '+n+'</span>':'')+
      '<span class="sp">置信度 '+Math.round((p.confidence||0)*100)+'%</span></div>'+
      '<div class="card-btns"><button class="btn sm" data-detail="'+esc(p.id)+'">查看完整研判</button>'+
      '<button class="btn sm primary" data-entry="'+esc(p.id)+'">＋ 录入新记录</button></div></article>';
  }).join("");
  $("#grid").querySelectorAll(".card").forEach(c => c.onclick = (e) => {
    if (e.target.closest("[data-entry]")) return;
    openDetail(c.dataset.id);
  });
  $("#grid").querySelectorAll("[data-entry]").forEach(b => b.onclick = (e) => { e.stopPropagation(); openEntry(b.dataset.entry); });
}

/* ---------- 详情抽屉 ---------- */
function sparkline(hist){
  if (!hist || hist.length < 2) return "";
  const n = hist.length, w = 150, h = 48;
  const pts = hist.map((x,i) => (8 + i*(w-16)/(n-1)).toFixed(1) + "," + (40 - (Number(x.progress)||0)/100*32).toFixed(1)).join(" ");
  const labels = hist.map(x => (x.as_of||"").slice(5)).join(" → ");
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:56px"><polyline points="'+pts+'" fill="none" stroke="var(--primary)" stroke-width="2.2" stroke-linejoin="round"/>'+
    hist.map((x,i) => '<circle cx="'+(8+i*(w-16)/(n-1)).toFixed(1)+'" cy="'+(40-(Number(x.progress)||0)/100*32).toFixed(1)+'" r="3" fill="var(--primary)"/>').join("")+
    '</svg><div style="font-size:10.5px;color:var(--muted);text-align:center">'+esc(labels)+'</div>';
}
function openDetail(id){
  const p = arr(DATA.projects).find(x => x.id === id); if(!p) return;
  openId = id;
  const sm = SM[p.status], rm = RM[p.risk_level]||RM.medium, gap = gapOf(p), n = inboxCount(p.name);
  const ms = arr(p.milestones), srcs = arr(p.sources), comms = arr(p.communications);
  const tlColor = { done:"var(--ok)", done_late:"var(--warn)", overdue:"var(--bad)", pending:"var(--muted)" };
  const tlLabel = { done:"按期完成", done_late:"延后完成", overdue:"已逾期", pending:"待完成" };
  const col = (title, items, color) => '<div><p class="mini-title" style="color:'+color+'">'+title+'</p><ul class="list-tight" style="--dot:'+color+'">'+
    (items.length ? items.map(x=>'<li>'+esc(x)+'</li>').join("") : '<li>暂无</li>')+'</ul></div>';

  let html = '<div class="drawer-head"><div class="row"><h2>'+esc(p.name)+'</h2><span class="badge '+p.status+'">'+sm.label+'</span>'+
    '<button class="close-x" data-close="1" aria-label="关闭">×</button></div>'+
    '<div class="card-meta" style="margin:10px 0 0"><span>'+esc(p.client||"—")+'</span><span>负责人 '+esc(p.owner||"—")+'</span>'+
    '<span><i class="risk-dot" style="background:'+rm.color+'"></i>'+rm.label+'</span><span>置信度 '+Math.round((p.confidence||0)*100)+'%</span></div></div>';
  html += '<div class="drawer-body">';
  html += '<div class="dblock"><h4>✦ AI 研判结论 <span class="tag">依据可追溯</span></h4>'+
    '<p style="margin:0 0 10px;font-size:13px;line-height:1.75">'+esc(p.summary)+'</p>'+
    '<div class="reason"><b>判定理由：</b>'+esc(p.status_reason)+'</div>'+
    '<div class="dgrid" style="margin-top:13px">'+
    '<div class="dstat"><div class="l">实际 / 计划</div><div class="v" style="color:'+sm.color+'">'+(p.progress||0)+' / '+(p.planned_progress||0)+'</div></div>'+
    '<div class="dstat"><div class="l">进度差</div><div class="v '+(gap<-5?"bad":"ok")+'">'+(gap>0?"+":"")+gap+' pt</div></div>'+
    '<div class="dstat"><div class="l">计划周期</div><div class="v" style="font-size:12px">'+esc(p.start_date||"—")+' → '+esc(p.due_date||"—")+'</div></div>'+
    '<div class="dstat"><div class="l">时间状态</div><div class="v '+(p.days_remaining<0?"bad":"")+'" style="font-size:13px">'+esc(daysText(p))+'</div></div></div>'+
    (arr(p.status_history).length>1 ? '<div style="margin-top:14px"><p class="mini-title">▸ 完成率变化</p>'+sparkline(p.status_history)+'</div>' : '')+
    '</div>';

  html += '<div class="dblock"><h4>▸ 关键进展 / 风险 / 下一步</h4><div class="three-col">'+
    col("关键进展", arr(p.highlights), "var(--ok)") + col("风险与阻塞", arr(p.risks), "var(--bad)") +
    '<div style="grid-column:1/-1;margin-top:4px">'+col("建议下一步", arr(p.next_actions), "var(--primary)")+'</div></div>'+
    (arr(p.evidence_gaps).length ? arr(p.evidence_gaps).map(g=>'<div class="gap-warn">⚠ 材料缺口：'+esc(g)+'</div>').join("") : '')+'</div>';

  html += '<div class="dblock"><h4>▸ 里程碑时间线 <span class="tag">'+ms.length+' 个节点</span></h4>'+
    (ms.length ? '<ul class="timeline">'+ms.map(m=>'<li style="--tl:'+(tlColor[m.state]||"var(--muted)")+'">'+
      '<div class="t-name">'+esc(m.name)+' <span style="font-size:10.5px;font-weight:600;color:'+(tlColor[m.state]||"var(--muted)")+'">'+esc(tlLabel[m.state]||m.state)+'</span></div>'+
      '<div class="t-meta">计划 '+esc(m.planned||"—")+' · 实际 '+esc(m.actual||"未完成")+'</div></li>').join("")+'</ul>' : '<p class="hint">暂无里程碑</p>')+'</div>';

  html += '<div class="dblock"><h4>▸ 研判依据：汇报与资料 <span class="tag">'+srcs.length+' 份</span></h4><div class="evidence">'+
    (srcs.length ? srcs.map(s=>'<div class="ev"><div class="ev-head"><span class="ev-type">'+esc(TM[s.type]||s.type)+'</span>'+
      '<b style="color:var(--text)">'+esc(s.file)+'</b><span>'+esc(s.date||"日期未知")+'</span></div>'+
      '<p class="ev-quote">'+esc(s.excerpt||"（无摘录）")+'</p></div>').join("") : '<p class="hint">暂无资料</p>')+'</div></div>';

  html += '<div class="dblock"><h4>▸ 交流沟通记录 <span class="tag">'+comms.length+' 条</span></h4><div class="evidence">'+
    (comms.length ? comms.map(c=>'<div class="ev"><div class="ev-head"><span class="sig '+(c.signal||"neutral")+'">'+esc(SIG[c.signal]||"常规")+'</span>'+
      '<b style="color:var(--text)">'+esc(c.channel||"沟通")+' · '+esc(c.from||"—")+'</b><span>'+esc(c.date||"")+'</span></div>'+
      '<p class="ev-quote">'+esc(c.excerpt||"")+'</p></div>').join("") : '<p class="hint">暂无沟通记录</p>')+
    (n ? '<div class="gap-warn">本项目有 '+n+' 条新录入记录待 AI 分析，导出待分析包并运行技能后状态才会更新。</div>' : '')+'</div></div>';

  html += '<div class="dblock"><h4>▸ 增量录入</h4><p class="hint" style="margin:0 0 12px">新的汇报文件、聊天记录、邮件都可以在这里录入，导出后交给技能重新研判。</p>'+
    '<button class="btn primary" data-entry="'+esc(p.id)+'">＋ 为本项目录入新记录</button>'+
    '<button class="btn" data-export="1" style="margin-left:8px">导出待分析包</button></div>';
  html += '</div>';

  $("#drawer").innerHTML = html;
  $("#drawer").classList.add("show"); $("#overlay").classList.add("show");
  $("#drawer").querySelectorAll("[data-close]").forEach(b=>b.onclick=closeAll);
  $("#drawer").querySelectorAll("[data-entry]").forEach(b=>b.onclick=()=>openEntry(b.dataset.entry));
  $("#drawer").querySelectorAll("[data-export]").forEach(b=>b.onclick=exportInbox);
}

/* ---------- 录入弹窗 ---------- */
const TEXT_EXT = ["txt","md","markdown","csv","tsv","json","log","eml","html","htm","xml","yaml","yml"];
function openEntry(projectId){
  const ps = arr(DATA.projects);
  const today = (DATA.meta.as_of || new Date().toISOString().slice(0,10));
  const opts = ps.map(p=>'<option value="'+esc(p.name)+'"'+(p.id===projectId?" selected":"")+'>'+esc(p.name)+'</option>').join("");
  $("#modal").innerHTML =
    '<div class="modal-head"><h3>＋ 录入项目汇报 / 沟通记录</h3><button class="close-x" data-close="1">×</button></div>'+
    '<div class="modal-body">'+
    '<div class="field"><label>所属项目</label><select id="fProject">'+opts+'</select></div>'+
    '<div class="field-row"><div class="field"><label>记录类型</label><select id="fType">'+
      '<option value="report">项目情况汇报</option><option value="communication">交流沟通记录</option>'+
      '<option value="milestone">里程碑 / 排期</option><option value="acceptance">验收 / 交付</option></select></div>'+
    '<div class="field"><label>记录日期</label><input type="date" id="fDate" value="'+esc(today)+'"></div></div>'+
    '<div class="field-row"><div class="field"><label>来源 / 渠道</label><input id="fSource" placeholder="如：企业微信、项目周报、客户邮件"></div>'+
    '<div class="field"><label>标题</label><input id="fTitle" placeholder="如：第 45 周项目周报"></div></div>'+
    '<div class="field"><label>正文内容（可直接粘贴聊天记录 / 汇报全文）</label><textarea id="fContent" placeholder="把项目情况汇报或沟通记录原文粘贴到这里……"></textarea></div>'+
    '<div class="field"><label>附加文件（支持任意格式）</label><div class="file-drop">'+
      'Word / Excel / PPT / PDF / 图片 / 压缩包 / 聊天导出等都可以选择<br>'+
      '<input type="file" id="fFiles" multiple accept=".txt,.md,.csv,.json,.log,.eml,.html,.htm,.xml,.docx,.xlsx,.pptx,.pdf,.doc,.xls,.ppt,.png,.jpg,.jpeg,.webp,.zip"></div>'+
      '<div class="file-note">纯文本类文件会直接读取内容；二进制文件仅登记文件名，请把它放到 <code>data/sources/&lt;项目名&gt;/</code> 后由技能解析。</div>'+
      '<div class="file-list" id="fFileList"></div></div>'+
    '<div class="field-note" style="background:var(--primary-soft);padding:10px 12px;border-radius:8px;margin-bottom:14px">'+
      '录入的记录会标记为「待 AI 分析」，<b>不会立即改变项目状态</b>。点击「导出待分析包」并运行技能后，AI 会重新研判并刷新看板。</div>'+
    '<div class="modal-foot"><button class="btn" data-close="1">取消</button><button class="btn primary" id="fSave">保存记录</button></div></div>';
  $("#modal").classList.add("show"); $("#overlay").classList.add("show");
  $("#modal").querySelectorAll("[data-close]").forEach(b=>b.onclick=closeAll);
  const fileInput = $("#fFiles");
  fileInput.onchange = () => {
    const names = [...fileInput.files].map(f=>f.name+"（"+(f.size/1024).toFixed(0)+" KB）");
    $("#fFileList").innerHTML = names.length ? names.map(n=>'<div>· '+esc(n)+'</div>').join("") : '<div style="color:var(--muted)">未选择文件</div>';
  };
  $("#fSave").onclick = async () => {
    const project = $("#fProject").value, content = $("#fContent").value.trim();
    const files = [...fileInput.files];
    if (!content && !files.length){ toast("请填写正文内容或选择文件"); return; }
    let extra = [], binary = [];
    for (const f of files){
      const ext = (f.name.split(".").pop()||"").toLowerCase();
      if (TEXT_EXT.includes(ext) && f.size < 300*1024){
        try { extra.push("【文件："+f.name+"】\n"+await f.text()); } catch(e){ binary.push(f.name); }
      } else { binary.push(f.name); }
    }
    INBOX.push({
      project: project, type: $("#fType").value, date: $("#fDate").value,
      source: $("#fSource").value.trim(), title: $("#fTitle").value.trim(),
      content: [content, extra.join("\n\n")].filter(Boolean).join("\n\n"),
      files: files.map(f=>({name:f.name,size:f.size})), binary_files: binary,
      created_at: new Date().toISOString()
    });
    writeLS(LS.inbox, INBOX); closeAll(); renderAll();
    toast("已保存 1 条待分析记录（" + project + "）");
  };
}
function openHelp(){
  $("#modal").innerHTML = '<div class="modal-head"><h3>使用说明</h3><button class="close-x" data-close="1">×</button></div>'+
    '<div class="modal-body"><ol class="help-list">'+
    '<li><b>看数据</b>：顶部 KPI、状态分布、进度对比；点任意项目卡片看完整 AI 研判、里程碑、依据摘录与沟通记录。</li>'+
    '<li><b>录入新材料</b>：点「录入项目记录」，可粘贴汇报/聊天原文，也可附加 Word、Excel、PPT、PDF、图片、压缩包等任意格式文件。</li>'+
    '<li><b>让 AI 重新分析（推荐，一键）</b>：启动 <code>python scripts/serve.py</code> 并从 <code>http://127.0.0.1:8765</code> 打开本页，点「✦ AI 一键重分析」——服务端会把新记录落盘、抽取证据、调用大模型研判、重建看板，结果直接刷新本页。配了 <code>PPT_LLM_API_KEY</code> 时全自动；未配置时生成证据包，在对话里说一句「分析这批新记录」，再点「↻ 同步最新研判」。</li>'+
    '<li><b>离线方式</b>：点「导出待分析包」得到 <code>inbox.json</code>，放到技能目录 <code>data/</code> 下，运行 <code>ingest_inbox.py --chain</code>，研判写入 <code>projects.json</code> 后重建看板。</li>'+
    '<li><b>接知识库</b>：技能支持从资料库 / 知识库检索项目周报、纪要并汇入同一条流水线，详见技能说明。</li>'+
    '<li><b>换数据</b>：「导入数据」可直接载入新的 <code>projects.json</code>；「导出数据」保存当前看板数据。</li>'+
    '</ol><p class="field-note">三态口径：超时＝已越过计划节点仍未完成；延误＝未到期但进度落后或存在实质阻塞；正常＝符合计划且无重大风险。</p>'+
    '<div class="modal-foot"><button class="btn" data-close="1">知道了</button></div></div>';
  $("#modal").classList.add("show"); $("#overlay").classList.add("show");
  $("#modal").querySelectorAll("[data-close]").forEach(b=>b.onclick=closeAll);
}
function closeAll(){
  $("#drawer").classList.remove("show"); $("#modal").classList.remove("show"); $("#overlay").classList.remove("show");
  openId = null;
}

/* ---------- 导入 / 导出 ---------- */
function download(name, text, mime){
  const blob = new Blob([text], {type:mime||"application/json;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 1200);
}
function exportInbox(){
  if (!INBOX.length){ toast("暂无待分析记录，先录入一条"); return; }
  const pack = {
    generated_at: new Date().toISOString(), as_of: DATA.meta.as_of,
    note: "把每条记录的 content 按 project 写入 data/sources/<项目名>/ 下（文件名可用 title），binary_files 里的文件请原样放入同一目录，然后重跑 extract_sources.py → analyze.py → build_dashboard.py",
    items: INBOX
  };
  download("inbox.json", JSON.stringify(pack, null, 2));
  toast("已导出 inbox.json（" + INBOX.length + " 条）");
}
function exportData(){
  download("projects.json", JSON.stringify(DATA, null, 2));
  toast("已导出当前看板数据");
}
function importData(file){
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const obj = JSON.parse(rd.result);
      if (!obj || !Array.isArray(obj.projects)) throw new Error("缺少 projects 数组");
      obj.projects.forEach(p => { if(!SM[p.status]) throw new Error("非法状态：" + p.status); });
      const t = obj.meta && obj.meta.totals ? obj.meta.totals : {total:obj.projects.length};
      t.total = obj.projects.length;
      t.on_track = obj.projects.filter(p=>p.status==="on_track").length;
      t.delayed = obj.projects.filter(p=>p.status==="delayed").length;
      t.overdue = obj.projects.filter(p=>p.status==="overdue").length;
      t.avg_progress = obj.projects.length ? Math.round(obj.projects.reduce((s,p)=>s+(Number(p.progress)||0),0)/obj.projects.length*10)/10 : 0;
      t.high_risk = obj.projects.filter(p=>p.risk_level==="high").length;
      obj.meta = obj.meta || {}; obj.meta.totals = t;
      DATA = obj; writeLS(LS.data, DATA); renderAll(); toast("已导入 " + obj.projects.length + " 个项目");
    } catch(e){ toast("导入失败：" + e.message); }
  };
  rd.readAsText(file, "utf-8");
}
function applyTheme(){
  document.documentElement.setAttribute("data-theme", UI.theme);
  $("#themeBtn").textContent = UI.theme === "dark" ? "☀ 浅色" : "◐ 深色";
  writeLS(LS.theme, UI.theme);
}

/* ---------- 启动 ---------- */
function renderAll(){
  $("#pageTitle").textContent = DATA.meta.title || "多项目进度看板";
  $("#pageSub").textContent = DATA.meta.subtitle || "客户项目组合 · 进度健康度巡检";
  document.title = (DATA.meta.title || "多项目进度看板") + " · " + (DATA.meta.as_of || "");
  $("#asOfChip").textContent = "基准日 " + (DATA.meta.as_of || "—");
  $("#demoChip").innerHTML = DATA.meta.demo ? '<span class="demo-tag">● 演示数据</span>' : "";
  $("#footLeft").textContent = "数据由项目进度技能生成 · 生成于 " + (DATA.meta.generated_at || "—") + " · 离线单文件看板";
  renderKPIs(); renderSummary(); renderDonut(); renderProgressBars(); renderToolbar(); renderGrid(); renderBridgeBar();
}
function bindGlobal(){
  $("#themeBtn").onclick = () => { UI.theme = UI.theme === "dark" ? "light" : "dark"; applyTheme(); };
  $("#helpBtn").onclick = openHelp;
  $("#addBtn").onclick = () => openEntry(openId);
  $("#exportBtn").onclick = exportData;
  $("#importBtn").onclick = () => $("#importFile").click();
  $("#importFile").onchange = (e) => { if(e.target.files[0]) importData(e.target.files[0]); e.target.value = ""; };
  $("#overlay").onclick = closeAll;
  document.addEventListener("keydown", (e) => { if(e.key === "Escape") closeAll(); });
}
applyTheme(); bindGlobal(); renderAll(); probeBridge();
</script>
