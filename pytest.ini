[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

markers =
    unit: 单元测试（无外部依赖，全 mock）
    integration: 集成测试（真实组件组合）
    e2e: 端到端测试（需要真实服务和凭证）
    slow: 耗时 > 5 秒的测试
    llm: LLM 提供商相关测试
    tools: 工具实现测试
    skills: 技能系统测试
    agent: Agent 核心循环测试
    channels: 渠道适配器测试
    api: FastAPI 路由测试
    db: 数据库操作测试
    browser: 浏览器自动化测试
    email: 邮件工具测试
    search: 搜索工具测试
    allow_direct_llm: 允许真实 _get_provider_api_key（跳过 autouse 屏蔽），用于测试直连 LLM 路径
    real_browser: 依赖真实浏览器/Node renderer 的测试（极慢且容器内可能 hang，默认跳过）

# 默认跳过 e2e 与 real_browser 测试（real_browser 单独运行：
# pytest -m "not e2e and real_browser" 或 ./scripts/dev_test.sh -m real_browser）
addopts = -m "not e2e and not real_browser"

log_cli = false
log_cli_level = WARNING
