[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

markers =
    unit: 单元测试（无外部依赖，全 mock）
    integration: 集成测试（真实组件组合）
    e2e: 端到端测试（需要真实服务和凭证）
    slow: 耗时 > 5 秒的测试
    llm: LLM 提供商相关测试
    tools: 工具实现测试
    skills: 技能系统测试
    agent: Agent 核心循环测试
    channels: 渠道适配器测试
    api: FastAPI 路由测试
    db: 数据库操作测试
    browser: 浏览器自动化测试
    email: 邮件工具测试
    search: 搜索工具测试

# 默认跳过 e2e 测试
addopts = -m "not e2e"

log_cli = false
log_cli_level = WARNING
