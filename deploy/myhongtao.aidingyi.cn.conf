# 宏陶 OSS 图片反向代理
# 背景：微信环境屏蔽宏陶 OSS 直链域名，通过自有域名反代绕过，供抓取数据中的图片在微信内正常显示
# 转发：https://myhongtao.aidingyi.cn/* -> https://myhongtao.oss-cn-shenzhen.aliyuncs.com/*
# 注意：上游用 oss-cn-shenzhen（深圳 region 标准写法）；数据源中出现过的
#       oss-cn-shen-zhen（多连字符）是无效域名（DNS NXDOMAIN），不要配成它
# 2026-09-22 创建（测试服务器 124.222.3.254）

server {
    listen 80;
    server_name myhongtao.aidingyi.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name myhongtao.aidingyi.cn;

    ssl_certificate /etc/nginx/conf.d/SSL/aidingyi.cn_nginx/STAR_aidingyi_cn_integrated.crt;
    ssl_certificate_key /etc/nginx/conf.d/SSL/aidingyi.cn_nginx/STAR_aidingyi_cn.key;

    access_log /var/log/nginx/myhongtao.aidingyi.cn.access.log;
    error_log /var/log/nginx/myhongtao.aidingyi.cn.error.log;

    location / {
        proxy_pass https://myhongtao.oss-cn-shenzhen.aliyuncs.com;
        # OSS 依赖 Host 头命中 bucket，必须改写为上游域名
        proxy_set_header Host myhongtao.oss-cn-shenzhen.aliyuncs.com;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 限速保护 5Mbps 出带宽：前 1MB 全速（小图秒回），超过后单连接 128KB/s（约 1Mbps）
        # 与下载点规范一致（.claude/rules/backend_dev.md）；不加 limit_conn，
        # 微信消息内多图并发加载，并发限制会导致第 3 张图起 503（同 inline 预览例外）
        limit_rate 128k;
        limit_rate_after 1m;
        # 静态图片，允许浏览器缓存
        expires 7d;
    }
}
