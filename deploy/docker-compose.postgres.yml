# PostgreSQL Docker Compose 配置
# 单实例方案：一个 PostgreSQL 容器同时服务生产 + 测试环境
# 通过数据库名和用户名隔离，节省服务器资源
# 包含 pgvector 扩展支持向量搜索
# 生产优化：连接池、WAL、内存、安全等配置

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: aid-postgres
    restart: unless-stopped
    environment:
      # 默认创建的数据库和用户（生产环境）
      POSTGRES_DB: ${POSTGRES_DB:-aid_work_agent}
      POSTGRES_USER: ${POSTGRES_USER:-aid_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Aid_2026}
      # 生产优化参数
      # 最大连接数（50用户场景，80足够；保留余量给后台管理/迁移等）
      POSTGRES_MAX_CONNECTIONS: 80
      # 共享缓冲区（8G内存推荐值512MB，约1/16）
      POSTGRES_SHARED_BUFFERS: 512MB
      # 有效缓存大小（告知PG可用OS缓存大小）
      POSTGRES_EFFECTIVE_CACHE_SIZE: 4096MB
      # 工作内存（每个排序/哈希操作，50用户并发时需要适中内存）
      POSTGRES_WORK_MEM: 8MB
      # 维护工作内存（索引重建、VACUUM更快）
      POSTGRES_MAINTENANCE_WORK_MEM: 256MB
      # WAL 配置（无需复制，使用 minimal 减少 WAL 开销）
      POSTGRES_WAL_LEVEL: minimal
      POSTGRES_MAX_WAL_SIZE: 1GB
      POSTGRES_MIN_WAL_SIZE: 256MB
      # 检查点配置
      POSTGRES_CHECKPOINT_COMPLETION_TARGET: 0.9
      # 随机页成本（SSD设为1.1，HDD设为4）
      POSTGRES_RANDOM_PAGE_COST: 1.1
      # 连接超时防护
      POSTGRES_IDLE_IN_TRANSACTION_SESSION_TIMEOUT: 60000
      POSTGRES_IDLE_SESSION_TIMEOUT: 300000
      # 日志配置
      POSTGRES_LOG_MIN_DURATION_STATEMENT: 1000
      POSTGRES_LOG_CHECKPOINTS: "on"
      POSTGRES_LOG_CONNECTIONS: "on"
      POSTGRES_LOG_DISCONNECTIONS: "on"
      # 时区
      TZ: Asia/Shanghai
      # 显式指定 locale，避免镜像默认 C.UTF-8 与数据卷历史版本不匹配
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      LANGUAGE: en_US:en
    command:
      - "postgres"
      - "-c"
      - "max_connections=80"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=4096MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "wal_level=minimal"
      # 禁用 WAL 发送者（minimal 模式不支持复制，必须设为0）
      - "-c"
      - "max_wal_senders=0"
      - "-c"
      - "max_wal_size=1GB"
      - "-c"
      - "min_wal_size=256MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "log_checkpoints=on"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
      - "-c"
      - "log_timezone=Asia/Shanghai"
      - "-c"
      - "timezone=Asia/Shanghai"
      - "-c"
      - "idle_in_transaction_session_timeout=60000"
      - "-c"
      - "idle_session_timeout=300000"
      - "-c"
      - "tcp_keepalives_idle=60"
      - "-c"
      - "tcp_keepalives_interval=10"
      - "-c"
      - "tcp_keepalives_count=6"
      # 语句超时：防止单条 SQL 长时间占用连接（30秒）
      - "-c"
      - "statement_timeout=30000"
      # 锁等待超时：防止死锁导致连接永远阻塞（10秒）
      - "-c"
      - "lock_timeout=10000"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # 持久化数据卷
      - postgres_data:/var/lib/postgresql/data
      # 初始化脚本（首次启动时执行，创建 prod + test 双库）
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - aid-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aid_user} -d ${POSTGRES_DB:-aid_work_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # 生产环境资源限制（50用户场景）
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 2G
          cpus: "1.0"
    shm_size: 1g
    # tmpfs 内存盘：PostgreSQL 临时文件（排序/哈希/临时表）写入内存，避免磁盘 IO
    tmpfs:
      - /pg_temp:mode=1777,size=1024m,uid=999,gid=999
      # 修复 timescaledb 镜像 mktemp 权限问题：tmpfs /tmp 必须显式声明 uid/gid=999(postgres)
      # 否则 entrypoint 切到 postgres 用户后 mktemp /tmp/passwd.XXXXXX 会 Permission denied
      - /tmp:mode=1777,size=200m,uid=999,gid=999
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  postgres_data:

networks:
  aid-network:
    driver: bridge
