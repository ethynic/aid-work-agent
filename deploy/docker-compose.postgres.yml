# PostgreSQL Docker Compose 配置
# 单实例方案：一个 PostgreSQL 容器同时服务生产 + 测试环境
# 通过数据库名和用户名隔离，节省服务器资源
# 包含 pgvector 扩展支持向量搜索
# 生产优化：连接池、WAL、内存、安全等配置

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aid-postgres
    restart: unless-stopped
    environment:
      # 默认创建的数据库和用户（生产环境）
      POSTGRES_DB: ${POSTGRES_DB:-aid_work_agent}
      POSTGRES_USER: ${POSTGRES_USER:-aid_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Aid_2026}
      # 生产优化参数
      # 最大连接数（默认100，生产+测试共用建议200-300）
      POSTGRES_MAX_CONNECTIONS: 200
      # 共享缓冲区（建议为物理内存的25%，需 <= shm_size）
      POSTGRES_SHARED_BUFFERS: 256MB
      # 有效缓存大小（建议为物理内存的75%）
      POSTGRES_EFFECTIVE_CACHE_SIZE: 1536MB
      # 工作内存（每个排序/哈希操作可用内存）
      POSTGRES_WORK_MEM: 16MB
      # 维护工作内存（VACUUM/CREATE INDEX等操作可用内存）
      POSTGRES_MAINTENANCE_WORK_MEM: 128MB
      # WAL 配置（无需复制，使用 minimal 减少 WAL 开销）
      POSTGRES_WAL_LEVEL: minimal
      POSTGRES_MAX_WAL_SIZE: 1GB
      POSTGRES_MIN_WAL_SIZE: 256MB
      # 检查点配置
      POSTGRES_CHECKPOINT_COMPLETION_TARGET: 0.9
      # 随机页成本（SSD设为1.1，HDD设为4）
      POSTGRES_RANDOM_PAGE_COST: 1.1
      # 连接超时防护
      POSTGRES_IDLE_IN_TRANSACTION_SESSION_TIMEOUT: 60000
      POSTGRES_IDLE_SESSION_TIMEOUT: 300000
      # 日志配置
      POSTGRES_LOG_MIN_DURATION_STATEMENT: 1000
      POSTGRES_LOG_CHECKPOINTS: "on"
      POSTGRES_LOG_CONNECTIONS: "on"
      POSTGRES_LOG_DISCONNECTIONS: "on"
      # 时区
      TZ: Asia/Shanghai
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "wal_level=minimal"
      - "-c"
      - "max_wal_size=1GB"
      - "-c"
      - "min_wal_size=256MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "log_checkpoints=on"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
      - "-c"
      - "log_timezone=Asia/Shanghai"
      - "-c"
      - "timezone=Asia/Shanghai"
      - "-c"
      - "idle_in_transaction_session_timeout=60000"
      - "-c"
      - "idle_session_timeout=300000"
      - "-c"
      - "tcp_keepalives_idle=60"
      - "-c"
      - "tcp_keepalives_interval=10"
      - "-c"
      - "tcp_keepalives_count=6"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # 持久化数据卷
      - postgres_data:/var/lib/postgresql/data
      # 初始化脚本（首次启动时执行，创建 prod + test 双库）
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - aid-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aid_user} -d ${POSTGRES_DB:-aid_work_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # 生产环境资源限制
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 2G
          cpus: "0.5"
    shm_size: 512mb
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  postgres_data:

networks:
  aid-network:
    driver: bridge
