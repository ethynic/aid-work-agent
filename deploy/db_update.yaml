        tenant_id TEXT NOT NULL,
        user_id TEXT NOT NULL,
        lineage_id UUID NOT NULL,
        version_no INTEGER NOT NULL,
        content_hash TEXT NOT NULL,
        template TEXT NOT NULL,
        slot_schema JSONB NOT NULL,
        source_script_id UUID,
