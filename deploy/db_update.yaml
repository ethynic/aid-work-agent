    CREATE INDEX IF NOT EXISTS idx_boss_comm_log_projection_scan
        ON bs_boss_comm_log_projection_queue (status, next_retry_at, created_at);
    DO $boss_comm_logs_alter$ BEGIN IF EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema = current_schema() AND table_name = 'bs_recruiting_operator_resume_comm_logs') THEN ALTER TABLE bs_recruiting_operator_resume_comm_logs ADD COLUMN IF NOT EXISTS source_delivery_id UUID; ALTER TABLE bs_recruiting_operator_resume_comm_logs ADD COLUMN IF NOT EXISTS source_message_id TEXT; CREATE UNIQUE INDEX IF NOT EXISTS uq_boss_comm_logs_source_delivery ON bs_recruiting_operator_resume_comm_logs (tenant_id, source_delivery_id); END IF; END $boss_comm_logs_alter$;
