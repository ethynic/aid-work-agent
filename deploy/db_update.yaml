  remark: "AgentRunner controls 账本撤除 runner_id 的 SQL 外键级联：系统表引用完整性按库规则改由应用层检查"
  statements: |
    -- M7 controls ledger FK retirement; system-table referential integrity is
    -- checked in application code (.claude/rules/database_dev.md), aligning the
    -- incremental path with the FK-free fresh DDL. Drop every foreign key on
    -- the table regardless of its generated name; replay and fresh installs
    -- with no FK left are a no-op.
    DO $$
    DECLARE
        fk RECORD;
    BEGIN
        IF to_regclass('agent_runner_controls') IS NOT NULL THEN
            FOR fk IN SELECT conname FROM pg_constraint
                WHERE conrelid='agent_runner_controls'::regclass AND contype='f' LOOP
                EXECUTE format('ALTER TABLE agent_runner_controls DROP CONSTRAINT %I', fk.conname);
            END LOOP;
        END IF;
    END $$;

- datetime: "2026-10-05 01:00:00"
  remark: "bs_browser_assistance_requests 持久化原随机 continuation_id（bac→Runner execution/call/wait 稳定映射，独立于 completion 相位）"
  statements: |
    -- 旧缓存 Browser 卡片透明迁移：bind_wait 每新 wait 持久写入 audit 中的
    -- continuation_id；存量 legacy 行保持 NULL，部分唯一索引允许多行 NULL 共存。
    -- 引用完整性按库规则由应用层检查，不在 SQL 层加 FK。
    DO $$
    DECLARE
        existing_count INTEGER;
    BEGIN
        IF to_regclass('bs_browser_assistance_requests') IS NULL THEN
            RAISE EXCEPTION 'BROWSER_ASSISTANCE_TABLE_REQUIRED';
        END IF;
        IF NOT EXISTS (SELECT 1 FROM pg_attribute
                WHERE attrelid='bs_browser_assistance_requests'::regclass
                  AND attname='continuation_id' AND NOT attisdropped) THEN
            ALTER TABLE bs_browser_assistance_requests ADD COLUMN continuation_id TEXT;
        END IF;
        IF NOT EXISTS (SELECT 1 FROM pg_attribute
                WHERE attrelid='bs_browser_assistance_requests'::regclass
                  AND attname='continuation_id' AND NOT attisdropped AND atttypid='text'::regtype) THEN
            RAISE EXCEPTION 'BROWSER_ASSISTANCE_CONTINUATION_COLUMN_INCOMPATIBLE';
        END IF;
        SELECT count(*) INTO existing_count FROM pg_index i
            JOIN pg_class c ON c.oid=i.indrelid
            WHERE c.relname='bs_browser_assistance_requests'
              AND i.indisunique AND i.indisvalid AND i.indpred IS NOT NULL
              AND (SELECT array_agg(a.attname ORDER BY k.n)
                   FROM unnest(i.indkey[0:i.indnkeyatts-1]) WITH ORDINALITY k(attnum,n)
                   JOIN pg_attribute a ON a.attrelid=c.oid AND a.attnum=k.attnum)
                   = ARRAY['continuation_id']::name[];
        IF existing_count = 0 THEN
            CREATE UNIQUE INDEX uq_browser_assistance_continuation
                ON bs_browser_assistance_requests (continuation_id)
                WHERE continuation_id IS NOT NULL;
        END IF;
    END $$;

- datetime: "2026-10-08 11:00:00"
  remark: "wecom_kf_input_preparations 补 io_config_version/dispatch_observed_at 两列并升级 ck_kf_preparation_shape——共库旧表结构缺列致语音转写授权 UPDATE 报 UndefinedColumn、语音任务全部中断"
  statements: |
    -- 背景：agent2/agent3 共库的 wecom_kf_input_preparations 建于 2026-09 开发期
    -- （旧结构无 io_config_version/dispatch_observed_at）；2026-10-03 14:00 块的
    -- CREATE TABLE IF NOT EXISTS 对已存在表跳过、同名约束 IF NOT EXISTS 亦跳过，
    -- 两列从未补上。voice_repository 授权 UPDATE 引用两列，语音任务执行即
    -- UndefinedColumn 中断（agent2 真机 2026-10-08 首条语音复现）。本块显式
    -- 补列并把约束升级到与 fresh DDL 一致（存量行为全 NULL，满足约束）。
    ALTER TABLE wecom_kf_input_preparations
        ADD COLUMN IF NOT EXISTS io_config_version TIMESTAMPTZ,
        ADD COLUMN IF NOT EXISTS dispatch_observed_at TIMESTAMPTZ;
    ALTER TABLE wecom_kf_input_preparations DROP CONSTRAINT IF EXISTS ck_kf_preparation_shape;
    ALTER TABLE wecom_kf_input_preparations ADD CONSTRAINT ck_kf_preparation_shape CHECK (
        operation_version>0 AND length(tenant_id)>0 AND length(intent_digest)=64
        AND jsonb_typeof(provenance)='object'
        AND phase IN ('media_ready','started','known','unknown')
        AND (artifact IS NULL OR jsonb_typeof(artifact)='object')
        AND (transcript IS NULL OR octet_length(transcript)<=32768)
        AND (authorized_attempt IS NULL OR authorized_attempt>0)
        AND (result_kind IS NULL OR result_kind IN ('recognition','preflight','provider'))
        AND (phase<>'media_ready' OR artifact IS NOT NULL)
        AND (phase<>'known' OR (result_kind IS NOT NULL AND transcript IS NOT NULL AND observed_at IS NOT NULL))
        AND (NOT success OR (phase='known' AND length(transcript)>0))
        AND ((receipt_id IS NULL AND fee_owner_runner_id IS NULL AND authorized_attempt IS NULL
              AND authorized_worker_id IS NULL AND physical_call_id IS NULL AND started_at IS NULL
              AND io_config_version IS NULL AND dispatch_observed_at IS NULL)
             OR (receipt_id IS NOT NULL AND fee_owner_runner_id IS NOT NULL AND authorized_attempt IS NOT NULL
              AND authorized_worker_id IS NOT NULL AND physical_call_id IS NOT NULL AND started_at IS NOT NULL
              AND io_config_version IS NOT NULL AND dispatch_observed_at IS NOT NULL))
        AND (phase NOT IN ('started','unknown') OR receipt_id IS NOT NULL)
        AND (result_kind IS DISTINCT FROM 'provider' OR receipt_id IS NOT NULL)
    );
    DO $$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_attribute
                WHERE attrelid='wecom_kf_input_preparations'::regclass
                  AND attname='io_config_version' AND NOT attisdropped)
           OR NOT EXISTS (SELECT 1 FROM pg_attribute
                WHERE attrelid='wecom_kf_input_preparations'::regclass
                  AND attname='dispatch_observed_at' AND NOT attisdropped) THEN
            RAISE EXCEPTION 'VOICE_PREPARATION_COLUMNS_MISSING';
        END IF;
    END $$;

