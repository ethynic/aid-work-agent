# deploy/db_update.yaml
# 数据库增量升级脚本：每个逻辑批次一个条目（一个块 = 一个逻辑批次），datetime 必须唯一且严格递增
# 所有 SQL 必须幂等安全（IF NOT EXISTS / DROP ... IF EXISTS / ON CONFLICT），可重复执行
# 字段说明：
#   datetime  增量判断基准，格式 YYYY-MM-DD HH:MM:SS（到秒），必须加引号写字符串，唯一且严格递增
#   remark    变更说明（必填，非空）
#   statements SQL 正文（block scalar，零转义），块内每句以分号结尾，统一缩进
# 执行：启动时只执行 datetime 晚于 _db_update_applied.last_datetime 的块，文件可无限累积无需清理
# 校验：字段缺失/时间格式错/重复/倒序/备注或 SQL 为空 会拒绝启动（fail-fast）
# 历史脚本（原 db_update.sql）已由运维手动在存量数据库执行完毕，本文件仅记录切换后的新增量脚本
- datetime: "2026-09-01 15:40:00"
  remark: "local_tool_invocations 增加 session_id：客户端计费台账归属会话（P2 客户端计费统一接入，write_result 计费时写入 client_usage_logs.session_id）"
  statements: |
    ALTER TABLE local_tool_invocations ADD COLUMN IF NOT EXISTS session_id TEXT;
- datetime: "2026-09-01 17:10:00"
  remark: "client_usage_logs 增加 client_ref_id（C 模式标准上报幂等键）+ 部分唯一索引（客户端计费统一接入 P4，设计 §4.4）"
  statements: |
    ALTER TABLE client_usage_logs ADD COLUMN IF NOT EXISTS client_ref_id TEXT;
    CREATE UNIQUE INDEX IF NOT EXISTS uq_client_usage_logs_tenant_ref
        ON client_usage_logs (tenant_id, client_ref_id) WHERE client_ref_id IS NOT NULL;
- datetime: "2026-09-03 11:20:00"
  remark: "token_cost_prices 新增 qwen3.8-flash 单价：输入 0.8 元/M、输出 2.7 元/M、缓存命中 0.16 元/M（隐式缓存命中按输入价 20%，无阶梯计价 0<T≤1M 单档）；DO UPDATE 更正早前 0.08（显式缓存口径）存量行"
  statements: |
    INSERT INTO token_cost_prices (model_name, input_price_per_m, output_price_per_m, cached_input_price_per_m)
    VALUES ('qwen3.8-flash', 0.8, 2.7, 0.16)
    ON CONFLICT (model_name) DO UPDATE SET
      input_price_per_m = EXCLUDED.input_price_per_m,
      output_price_per_m = EXCLUDED.output_price_per_m,
      cached_input_price_per_m = EXCLUDED.cached_input_price_per_m;
- datetime: "2026-09-04 17:01:53"
  remark: "subagent_definitions 增加 recap JSONB：自定义数字员工承载 recap 轮后沉淀任务配置（结构同 SUBAGENT.md frontmatter recap 块）"
  statements: |
    ALTER TABLE subagent_definitions ADD COLUMN IF NOT EXISTS recap JSONB DEFAULT '{}';
