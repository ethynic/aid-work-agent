# ============================================
# AID Work Agent 仿真环境（staging）Nginx 配置
# 域名: agent1.aidingyi.cn  →  localhost:8010 (aid-agent-api1)
# 设计文档: docs/system/simulation-env-design.md §6
# ============================================
#
# 部署位置: 243 服务器 /etc/nginx/conf.d/agent1.aidingyi.cn.conf
# 上线步骤:
#   1. 创建白名单文件 /etc/nginx/snippets/sim_whitelist.conf（内容见下方说明）
#   2. nginx -t && nginx -s reload
#
# ⚠️ 白名单必须放 snippets/ 而不是 conf.d/：nginx.conf 会把 conf.d/*.conf
#    收进 http 层，裸 allow/deny 会成为 http 级规则被所有 server 继承，
#    导致生产环境所有无白名单 location（含渠道回调）被 deny all 拦成 403。
#    2026-09-17 上线时踩坑并即时修复（生产 /health 一度 403）。
#
# sim_whitelist.conf 内容示例（办公出口 IP，与 fail2ban 白名单同批）:
#   allow 111.222.333.444;
#   deny all;
#
# 访问控制总策略:
#   - 前端 / API / 静态资源：仅办公 IP 白名单（客户无法误入）
#   - 渠道回调路径：不做 IP 限制（回调来自服务商服务器 IP），
#     安全性由后端验签保证 + 同步脚本已置空渠道凭证（误路由的生产回调验签必败）
# ============================================

server {
    listen 443 ssl;
    server_name agent1.aidingyi.cn;

    # 仿真环境站点根目录
    root /var/www/agent1/frontend/dist/;
    index index.html index.htm;

    server_tokens off;

    include       /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }
    default_type  application/octet-stream;

    client_max_body_size 100m;
    limit_rate 1m;

    proxy_connect_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_read_timeout 1800s;

    add_header X-XSS-Protection "1; mode=block";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # 独立日志（与生产区分环境）
    access_log /var/log/nginx/agent1_access.log;
    error_log  /var/log/nginx/agent1_error.log;

    # ========== SSL 配置（与生产同族证书） ==========
    ssl_certificate /etc/nginx/conf.d/SSL/aidingyi.cn_nginx/STAR_aidingyi_cn_integrated.crt;
    ssl_certificate_key /etc/nginx/conf.d/SSL/aidingyi.cn_nginx/STAR_aidingyi_cn.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL1:10m;

    # ========== 安全配置 ==========
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~* \.(env|log|git|gitignore|dockerignore)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ========== 渠道回调路径（不做 IP 限制，后端验签把关） ==========
    # /t/{tenant_id}/{channel}/callback（wecom_personal_rpa 含子路径）
    location ~ ^/t/[^/]+/(wecom|dingtalk|feishu|wecom_kf)/callback {
        proxy_pass http://localhost:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/t/[^/]+/wecom_personal_rpa/callback(/.*)? {
        proxy_pass http://localhost:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 微信公众号回调（走 /api/ 前缀，需在 /api/ 之前以正则命中并豁免 IP 白名单）
    location ~ ^/api/wechat-mp/callback {
        proxy_pass http://localhost:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========== 后端 API 代理（办公 IP 白名单） ==========
    location /api/ {
        include /etc/nginx/snippets/sim_whitelist.conf;

        proxy_pass http://localhost:8010;
        proxy_http_version 1.1;

        # WebSocket / SSE 流式输出
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_cache off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # ========== 静态资源（办公 IP 白名单） ==========
    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        include /etc/nginx/snippets/sim_whitelist.conf;

        root /var/www/agent1/frontend/dist/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # ========== 前端 SPA 路由（办公 IP 白名单） ==========
    location / {
        include /etc/nginx/snippets/sim_whitelist.conf;

        root /var/www/agent1/frontend/dist/;
        index index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # ========== 上传文件目录（共享生产 agent_uploads，白名单） ==========
    location /uploads/ {
        include /etc/nginx/snippets/sim_whitelist.conf;

        alias /var/www/qb3_upload/agent_uploads/;
        try_files $uri $uri/ =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ========== 健康检查 ==========
    location = /health {
        proxy_pass http://localhost:8010/health;
        access_log off;
    }

    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# ========== HTTP 重定向到 HTTPS ==========
server {
    listen 80;
    server_name agent1.aidingyi.cn;
    return 301 https://$host$request_uri;
}

# ============================================
# 配置说明：
# 1. 与生产的差异：
#    - 反代 localhost:8010（仿真容器 aid-agent-api1）
#    - 前端目录 /var/www/agent1/frontend/dist/
#    - 办公 IP 白名单（sim_whitelist.conf），渠道回调路径豁免
#    - 独立 access/error 日志
#    - 不配置下载限速正则（办公内网使用，且避免与生产 conf 重复声明
#      limit_conn_zone / limit_req_zone 导致 nginx -t 报错）
#    - 不提供 /memories/ 静态目录（仿真环境无记忆文件需求）
# 2. ssl_session_cache 命名为 SSL1，避免与生产 conf 的 shared:SSL 冲突
# ============================================
