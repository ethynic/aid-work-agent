# 济南诺度私有云 PostgreSQL（139.129.48.30）
# 基于 deploy/docker-compose.postgres.yml 适配混部环境（与客户存量业务同机）：
# 1. 端口只绑 127.0.0.1（宿主机 psql/备份脚本本机入口；公网必不可达）。
#    教训：阿里云公网 IP 是 NAT 到内网 IP，「绑内网 IP」≠ 公网不可达（2026-10-21 实测
#    172.29.49.136 绑定从办公网可达，安全组限制未按预期生效）；app 容器改经共享
#    docker 网络 app_aid-network 以服务名 postgres:5432 直连，不再依赖宿主机端口
# 2. 内存参数 2026-10-21 调优（Java 应用压缩 -Xmx 后腾出内存）：shared_buffers 1GB、
#    work_mem 16MB、maintenance 512MB、effective_cache_size 6GB、/pg_temp 2G、容器上限 4G
# 3. 密码经同目录 .env 注入（POSTGRES_PASSWORD），不入库不入对话

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: aid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aid_work_agent}
      POSTGRES_USER: ${POSTGRES_USER:-aid_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      # 混部优化（16G 宿主机，本项目可用约 7G）：
      POSTGRES_MAX_CONNECTIONS: 40
      POSTGRES_SHARED_BUFFERS: 1GB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 6144MB
      POSTGRES_WORK_MEM: 16MB
      POSTGRES_MAINTENANCE_WORK_MEM: 512MB
      POSTGRES_WAL_LEVEL: minimal
      POSTGRES_MAX_WAL_SIZE: 1GB
      POSTGRES_MIN_WAL_SIZE: 256MB
      POSTGRES_CHECKPOINT_COMPLETION_TARGET: 0.9
      POSTGRES_RANDOM_PAGE_COST: 1.1
      POSTGRES_IDLE_IN_TRANSACTION_SESSION_TIMEOUT: 60000
      POSTGRES_IDLE_SESSION_TIMEOUT: 600000
      POSTGRES_LOG_MIN_DURATION_STATEMENT: 1000
      POSTGRES_LOG_CHECKPOINTS: "on"
      POSTGRES_LOG_CONNECTIONS: "on"
      POSTGRES_LOG_DISCONNECTIONS: "on"
      TZ: Asia/Shanghai
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      LANGUAGE: en_US:en
    command:
      - "postgres"
      - "-c"
      - "max_connections=40"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "effective_cache_size=6144MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "temp_tablespaces=/pg_temp"
      - "-c"
      - "wal_level=minimal"
      - "-c"
      - "max_wal_senders=0"
      - "-c"
      - "max_wal_size=1GB"
      - "-c"
      - "min_wal_size=256MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "log_checkpoints=on"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
      - "-c"
      - "log_timezone=Asia/Shanghai"
      - "-c"
      - "timezone=Asia/Shanghai"
      - "-c"
      - "idle_in_transaction_session_timeout=60000"
      - "-c"
      - "idle_session_timeout=600000"
      - "-c"
      - "tcp_keepalives_idle=60"
      - "-c"
      - "tcp_keepalives_interval=10"
      - "-c"
      - "tcp_keepalives_count=6"
      - "-c"
      - "statement_timeout=30000"
      - "-c"
      - "lock_timeout=10000"
    ports:
      # 只绑 127.0.0.1：仅供宿主机 psql/备份脚本使用；app 容器走 app_aid-network 服务名直连
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # init.sql 仅在数据卷首次初始化时执行（主库建表）
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app_aid-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aid_user} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "1.5"
        reservations:
          memory: 2G
          cpus: "0.5"
    shm_size: 512m
    tmpfs:
      - /pg_temp:mode=1777,size=2048m,uid=999,gid=999
      - /tmp:mode=1777,size=200m,uid=999,gid=999
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  postgres_data:

networks:
  app_aid-network:
    external: true
    name: app_aid-network
