# ============================================
# AID Work Agent Nginx 配置（济南诺度私有云）
# 域名: agent.jzzysd.com -> localhost:8000 (aid-agent-api)
# 部署目录: /var/www/aid/app（前端 dist）/ /var/www/aid/agent_uploads
# 由宝塔 nginx（/www/server/nginx）加载：include /www/server/panel/vhost/nginx/*.conf
# ============================================

# ========== 限流配置 ==========
# zone 命名避开宝塔内置 perip/perserver（nginx.conf http 层）
limit_conn_zone $binary_remote_addr zone=nd_perip_conn:10m;
limit_conn_zone $binary_remote_addr zone=nd_dl_conn:10m;
limit_req_zone $binary_remote_addr zone=nd_perip_req:10m rate=10r/s;

# ========== HTTPS ==========
server {
    listen 443 ssl;
    server_name agent.jzzysd.com;

    root /var/www/aid/app/frontend/dist/;
    index index.html index.htm;
    server_tokens off;

    # 宝塔 nginx 的 mime.types 路径（与 Debian nginx 不同）
    include       /www/server/nginx/conf/mime.types;
    types {
        application/javascript mjs;
    }
    default_type  application/octet-stream;

    client_max_body_size 100m;
    limit_rate 1m;

    proxy_connect_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_read_timeout 1800s;

    add_header X-XSS-Protection "1; mode=block";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # ========== SSL（acme.sh 签发；宝塔锁死 panel/vhost 目录无法写入，证书自管在 /var/www/aid/cert） ==========
    ssl_certificate /var/www/aid/cert/agent.jzzysd.com/fullchain.pem;
    ssl_certificate_key /var/www/aid/cert/agent.jzzysd.com/privkey.pem;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:ND_SSL:10m;

    # ========== 安全配置 ==========
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|log|git|gitignore|dockerignore)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ========== 静态资源 ==========
    # Web Push worker：缺失时不得走 SPA fallback
    location = /task-notifications-sw.js {
        root /var/www/aid/app/frontend/dist/;
        types { application/javascript js; }
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        error_page 404 =404 @notification_worker_missing;
        try_files $uri =404;
    }
    location @notification_worker_missing {
        return 404;
    }

    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/aid/app/frontend/dist/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # ========== 前端路由（SPA） ==========
    location / {
        root /var/www/aid/app/frontend/dist/;
        index index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        try_files $uri $uri/ /index.html;
    }

    # ========== 知识库上传（严格限速，10Mbps 带宽） ==========
    location /api/knowledge/upload {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        # 单文件 256KB/s，单 IP 串行上传
        limit_rate 256k;
        limit_conn nd_perip_conn 1;
        limit_req zone=nd_perip_req burst=3 nodelay;
        limit_conn_log_level warn;
        limit_req_log_level warn;
    }

    # ========== 文件下载（单独限速，新增下载点必须同步加入正则） ==========
    location ~ ^/api/(files/[^/]+/download|knowledge/documents/[0-9]+/download|saas/external-customers/attachments/download|saas/tenant/config-file/[^/]+|v1/travel-quote/(vehicles|meals|guides|fees|seasons|kb/attractions|kb/hotels)/export|v1/travel-quote/import/template|v1/channels/wecom-personal-rpa/files/[^/]+)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        # 单连接 128KB/s（1Mbps），前 1MB 全速，单 IP 并发 2
        limit_rate 128k;
        limit_rate_after 1m;
        limit_conn nd_dl_conn 2;
        limit_conn_log_level warn;
    }

    # ========== 后端 API（SSE 流式：关闭缓冲） ==========
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
    }

    # ========== 租户渠道回调 ==========
    location ~ ^/t/[^/]+/(wecom|dingtalk|feishu|wecom_kf)/callback {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/t/[^/]+/wecom_personal_rpa/callback(/.*)? {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========== 上传目录 ==========
    location /uploads/ {
        alias /var/www/aid/agent_uploads/;
        try_files $uri $uri/ =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        location ~* \.(jpg|jpeg|png|gif|pdf|doc|docx|xls|xlsx|txt)$ {
            expires 30d;
        }
    }

    # ========== 健康检查 ==========
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }

    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    access_log /www/wwwlogs/agent.jzzysd.com.log;
    error_log /www/wwwlogs/agent.jzzysd.com.error.log;
}

# ========== HTTP：ACME 验证 + 企微校验文件 + 301 ==========
server {
    listen 80;
    server_name agent.jzzysd.com;

    # ACME HTTP-01 webroot（acme.sh -w /var/www/aid/acme）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/aid/acme;
        default_type "text/plain";
    }

    # 企微/微信可信域名归属校验文件：只走 http 且不跟随 301，必须直接 200
    location ~ ^/WW_verify_\w+\.txt$ {
        root /var/www/aid/app/frontend/dist/;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /www/wwwlogs/agent.jzzysd.com.log;
}
