# ============================================
# AID Work Agent Nginx 配置文件
# 域名: agent.aidingyi.cn
# ============================================

# HTTPS 服务器配置
server {
    # 监听端口
    listen 443 ssl;
    server_name agent.aidingyi.cn;
    
    # 站点根目录（前端静态文件）
    root /var/www/agent/frontend/dist/;
    index index.html index.htm;
    
    # 隐藏 Nginx 版本号
    server_tokens off;
    
    # 客户端请求体大小限制（用于文件上传）
    client_max_body_size 100m;
    
    # 代理超时设置（用于长时间运行的任务）
    proxy_connect_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_read_timeout 1800s;
    
    # 安全头设置
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    
    # Gzip 压缩配置
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;
    
    # ========== SSL 配置 ==========
    ssl_certificate /etc/nginx/conf.d/SSL/aidingyi.cn_nginx/STAR_aidingyi_cn_integrated.crt;
    ssl_certificate_key /etc/nginx/conf.d/SSL/aidingyi.cn_nginx/STAR_aidingyi_cn.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    
    # ========== 安全配置 ==========
    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # 禁止访问敏感文件
    location ~* \.(env|log|git|gitignore|dockerignore)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # ========== 静态资源配置 ==========
    # 静态文件（JS/CSS/图片等）- 长期缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/agent/frontend/dist/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }
    
    # ========== 前端路由配置 ==========
    # SPA 应用 - 所有路由返回 index.html
    location / {
        root /var/www/agent/frontend/dist/;
        index index.html;
        
        # 不缓存 HTML 文件
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        
        # 尝试匹配文件，如果不存在则返回 index.html（支持前端路由）
        try_files $uri $uri/ /index.html;
    }
    
    # ========== 后端 API 代理配置 ==========
    # API 请求代理到 Docker 容器
    location /api/ {
        # 代理目标地址（注意：端口应与 docker-compose.prod.yml 中的 API_PORT 一致）
        proxy_pass http://localhost:8000;
        
        # HTTP 版本
        proxy_http_version 1.1;
        
        # WebSocket 支持（用于流式输出）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        
        # 请求头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲设置（对 SSE 流式输出很重要）
        proxy_buffering off;
        proxy_cache off;
    }
    
    # ========== 企业微信回调配置 ==========
    # 企业微信消息回调接口
    location /wecom/callback {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # ========== 钉钉回调配置 ==========
    location /dingtalk/callback {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # ========== 飞书回调配置 ==========
    location /feishu/callback {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # ========== 文件上传目录配置 ==========
    # 用户上传的文件目录
    location /uploads/ {
        alias /var/www/qb3_upload/agent_uploads/;
        try_files $uri $uri/ =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        
        # 允许的文件类型（安全限制）
        location ~* \.(jpg|jpeg|png|gif|pdf|doc|docx|xls|xlsx|txt)$ {
            expires 30d;
        }
    }
    
    # ========== 记忆文件目录配置 ==========
    # Agent 记忆文件目录（Markdown 文件）
    location /memories/ {
        alias /var/www/qb3_upload/agent_memories/;
        try_files $uri $uri/ =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header Content-Disposition inline;
        
        # Markdown 文件特殊处理
        if ($request_filename ~* \.md$) {
            add_header Content-Type "text/plain; charset=utf-8";
        }
    }
    
    # ========== 健康检查端点 ==========
    location /health {
        proxy_pass http://localhost:8000/health;
        access_log off;
    }
    
    # ========== 错误页面配置 ==========
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# ========== HTTP 重定向到 HTTPS ==========
server {
    listen 80;
    server_name agent.aidingyi.cn;
    
    # 重定向到 HTTPS
    return 301 https://$host$request_uri;
    
    # Let's Encrypt 验证路径（如需要）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

# ============================================
# 配置说明：
# 
# 1. 端口映射：
#    - 宿主机 80/443 → Nginx
#    - Nginx /api/* → localhost:8000 (Docker 容器)
#    - Docker 容器内部端口: 8000
#
# 2. 文件路径：
#    - 前端: /var/www/agent/frontend/dist/
#    - 上传文件: /var/www/qb3_upload/agent_uploads/
#    - 记忆文件: /var/www/qb3_upload/agent_memories/
#
# 3. 安全配置：
#    - 已启用 Gzip 压缩
#    - 已配置静态资源缓存
#    - 已隐藏 Nginx 版本号
#    - 已禁止访问隐藏文件和敏感文件
#
# 4. 注意事项：
#    - 确保 SSL 证书路径正确
#    - 确保后端容器运行在 8000 端口
#    - 确保文件目录权限正确（www-data 用户）
# ============================================
