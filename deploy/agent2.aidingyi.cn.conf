# ========== 限流配置 ==========
# 限制单个 IP 并发连接数（防止恶意请求）
limit_conn_zone $binary_remote_addr zone=perip_conn_agent2:10m;

# 限制单个 IP 请求频率（每秒 10 个请求，突发 20 个）
limit_req_zone $binary_remote_addr zone=perip_req_agent2:10m rate=10r/s;

# 测试环境配置
server {
    # 监听端口
    listen 443 ssl;
    server_name agent2.aidingyi.cn;

    # 站点根目录（前端静态文件）
    root /var/www/agent2/frontend/dist/;
    index index.html index.htm;

    # 隐藏 Nginx 版本号
    server_tokens off;

    # 客户端请求体大小限制（用于文件上传）
    client_max_body_size 100m;

    # 全局上传速率限制（每个请求 1MB/s）
    limit_rate 1m;
    
    # 代理超时设置（用于长时间运行的任务）
    proxy_connect_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_read_timeout 1800s;
    
    # 安全头设置
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    
    # Gzip 压缩配置
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;
    
    # ========== SSL 配置 ==========
    ssl_certificate /etc/nginx/conf.d/SSL/aidingyi.cn_nginx/STAR_aidingyi_cn_integrated.crt;
    ssl_certificate_key /etc/nginx/conf.d/SSL/aidingyi.cn_nginx/STAR_aidingyi_cn.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    
    # ========== 安全配置 ==========
    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # 禁止访问敏感文件
    location ~* \.(env|log|git|gitignore|dockerignore)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # ========== 静态资源配置 ==========
    # 静态文件（JS/CSS/图片等）- 长期缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/agent2/frontend/dist/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }
    
    # ========== 前端路由配置 ==========
    # SPA 应用 - 所有路由返回 index.html
    location / {
        root /var/www/agent2/frontend/dist/;
        index index.html;
        
        # 不缓存 HTML 文件
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        
        # 尝试匹配文件，如果不存在则返回 index.html（支持前端路由）
        try_files $uri $uri/ /index.html;
    }
    
    # ========== 知识库上传接口（单独限速） ==========
    # 知识库文件上传 - 严格限速，服务器总带宽仅 5Mbps（约 625KB/s）
    location /api/knowledge/upload {
        # 代理目标地址
        proxy_pass http://localhost:8001;

        # HTTP 版本
        proxy_http_version 1.1;

        # 请求头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置（上传大文件需要更长时间，按 50MB @ 256KB/s ≈ 200 秒计算）
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # ========== 限速配置 ==========
        # 单文件上传速率限制：256KB/s（约 2Mbps）
        # 服务器总带宽仅 5Mbps（≈ 625KB/s），留足带宽给其他用户
        limit_rate 256k;

        # 单个 IP 并发连接数限制：1 个（串行上传，不并发）
        # 即使前端同时发起多个请求，也只能 1 个 1 个传
        limit_conn perip_conn_agent2 1;

        # 请求频率限制：每秒最多 1 个上传请求（突发 3 个）
        limit_req zone=perip_req_agent2 burst=3 nodelay;

        # 限速日志
        limit_conn_log_level warn;
        limit_req_log_level warn;
    }

    # ========== 后端 API 代理配置 ==========
    # API 请求代理到 Docker 容器
    location /api/ {
        # 代理目标地址（注意：端口应与 docker-compose.prod.yml 中的 API_PORT 一致）
        proxy_pass http://localhost:8001;

        # HTTP 版本
        proxy_http_version 1.1;

        # WebSocket 支持（用于流式输出）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # 请求头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # 缓冲设置（对 SSE 流式输出很重要）
        proxy_buffering off;
        proxy_cache off;
    }
    
    # ========== 租户渠道回调配置 ==========
    # 匹配 /t/{tenant_id}/wecom/callback, /t/{tenant_id}/dingtalk/callback, /t/{tenant_id}/feishu/callback
    location ~ ^/t/[^/]+/(wecom|dingtalk|feishu)/callback {
        proxy_pass http://localhost:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # ========== 文件上传目录配置 ==========
    # 用户上传的文件目录
    location /uploads/ {
        alias /var/www/qb3_upload/agent2_uploads/;
        try_files $uri $uri/ =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        
        # 允许的文件类型（安全限制）
        location ~* \.(jpg|jpeg|png|gif|pdf|doc|docx|xls|xlsx|txt)$ {
            expires 30d;
        }
    }
    
    # ========== 记忆文件目录配置 ==========
    # agent2 记忆文件目录（Markdown 文件）
    location /memories/ {
        alias /var/www/qb3_upload/agent2_memories/;
        try_files $uri $uri/ =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header Content-Disposition inline;
        
        # Markdown 文件特殊处理
        if ($request_filename ~* \.md$) {
            add_header Content-Type "text/plain; charset=utf-8";
        }
    }
    
    # ========== 健康检查端点 ==========
    location /health {
        proxy_pass http://localhost:8001/health;
        access_log off;
    }
    
    # ========== 错误页面配置 ==========
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# ========== HTTP 重定向到 HTTPS ==========
server {
    listen 80;
    server_name agent2.aidingyi.cn;
    
    # 重定向到 HTTPS
    return 301 https://$host$request_uri;
    
}

# ============================================
# 配置说明：
#
# 1. 端口映射：
#    - 宿主机 80/443 → Nginx
#    - Nginx /api/* → localhost:8001 (Docker 容器)
#    - Docker 容器内部端口: 8001
#
# 2. 文件路径：
#    - 前端: /var/www/agent2/frontend/dist/
#    - 上传文件: /var/www/qb3_upload/agent2_uploads/
#    - 记忆文件: /var/www/qb3_upload/agent2_memories/
#
# 3. 安全配置：
#    - 已启用 Gzip 压缩
#    - 已配置静态资源缓存
#    - 已隐藏 Nginx 版本号
#    - 已禁止访问隐藏文件和敏感文件
#
# 4. 上传限速配置说明（知识库）：
#    - 服务器总带宽：5Mbps（约 625KB/s）
#    - 单文件上传速率：256KB/s（约 2Mbps）
#    - 单 IP 并发上传连接数：1 个（串行上传，1 个传完再传下 1 个）
#    - 请求频率限制：每秒最多 1 个上传请求（突发 3 个）
#    - 全局其他请求限速：1MB/s
#
#    效果：即使有用户同时选择很多文件上传，也只占用约 1Mbps 带宽
#    示例：上传 10 个 50MB 文件
#          - 1 个 1 个串行上传，每个速度约 256KB/s
#          - 每个文件大约需要 50MB / 256KB/s ≈ 200 秒
#
# 5. 注意事项：
#    - 确保 SSL 证书路径正确
#    - 确保后端容器运行在 8001 端口
#    - 确保文件目录权限正确（www-data 用户）
#    - 限流配置需要 ngx_http_limit_conn_module 和 ngx_http_limit_req_module 模块
#      （标准 Nginx 发行版默认已包含）
# ============================================
