# AID Work Agent Docker Compose 配置
# 支持 FastAPI 和 Gradio 两种部署模式

services:
  # FastAPI 服务（默认）
  aid-agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aid-agent-api:latest
    container_name: aid-agent-api
    restart: unless-stopped
    user: "0"
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - SERVER_MODE=fastapi
      - SERVER_PORT=8000
      - DEBUG=true
      - WATCHFILES_FORCE_POLLING=true
    volumes:
      - .:/app
    networks:
      - aid-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # 提供完整的交互式终端支持（方向键、命令历史、路径提示符）
    stdin_open: true
    tty: true
    # 清空 Dockerfile 的 ENTRYPOINT，否则 command 不会生效
    # Dockerfile 默认使用 gunicorn，这里改为 uvicorn 用于本地开发
    entrypoint: []
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --no-access-log

networks:
  aid-network:
    driver: bridge
