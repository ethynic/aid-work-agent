# AID Work Agent Docker Compose 配置
# 支持 FastAPI 和 Gradio 两种部署模式

services:
  # FastAPI 服务（默认）
  aid-agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aid-agent-api
    restart: unless-stopped
    # 本地开发：以 root 启动确保挂载目录有写入权限
    user: "0"
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # 服务模式（固定值）
      - SERVER_MODE=fastapi
      - SERVER_PORT=8000
      # 调试模式（本地开发启用）
      - DEBUG=true
    volumes:
      # 挂载项目根目录到容器，实现代码热更新
      - .:/app
      # 日志目录由容器内创建，不再挂载
      # - ./log:/app/log
    networks:
      - aid-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Gradio UI 服务（可选）
  aid-agent-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aid-agent-ui
    restart: unless-stopped
    # 本地开发：以 root 启动确保挂载目录有写入权限
    user: "0"
    ports:
      - "${GRADIO_PORT:-7860}:7860"
    env_file:
      - .env
    environment:
      # 服务模式（覆盖为 gradio）
      - SERVER_MODE=gradio
      - SERVER_PORT=7860
      # 调试模式（本地开发启用）
      - DEBUG=true
    volumes:
      # 挂载项目根目录到容器，实现代码热更新
      - .:/app
      # 日志目录由容器内创建，不再挂载
      # - ./log:/app/log
    networks:
      - aid-network
    profiles:
      - ui  # 使用 docker compose --profile ui 启动

networks:
  aid-network:
    driver: bridge
