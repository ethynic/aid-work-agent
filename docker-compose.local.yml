# AID Work Agent Docker Compose 配置
# 支持 FastAPI 和 Gradio 两种部署模式

services:
  # PostgreSQL 数据库服务（包含 pgvector 扩展）
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aid_work_agent}
      POSTGRES_USER: ${POSTGRES_USER:-aid_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Aid_2026}
      POSTGRES_MAX_CONNECTIONS: 200
      POSTGRES_SHARED_BUFFERS: 512MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 1536MB
      POSTGRES_WORK_MEM: 16MB
      POSTGRES_MAINTENANCE_WORK_MEM: 256MB
      POSTGRES_WAL_LEVEL: replica
      POSTGRES_MAX_WAL_SIZE: 2GB
      POSTGRES_MIN_WAL_SIZE: 512MB
      POSTGRES_CHECKPOINT_COMPLETION_TARGET: 0.9
      POSTGRES_RANDOM_PAGE_COST: 1.1
      POSTGRES_LOG_MIN_DURATION_STATEMENT: 1000
      POSTGRES_LOG_CHECKPOINTS: "on"
      POSTGRES_LOG_CONNECTIONS: "on"
      POSTGRES_LOG_DISCONNECTIONS: "on"
      TZ: Asia/Shanghai
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "min_wal_size=512MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "log_checkpoints=on"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
      - "-c"
      - "log_timezone=Asia/Shanghai"
      - "-c"
      - "timezone=Asia/Shanghai"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - aid-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aid_user} -d ${POSTGRES_DB:-aid_work_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    shm_size: 256mb
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # FastAPI 服务（默认）
  aid-agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aid-agent-api
    restart: unless-stopped
    user: "0"
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - SERVER_MODE=fastapi
      - SERVER_PORT=8000
      - DEBUG=true
      - WATCHFILES_FORCE_POLLING=true
    volumes:
      - .:/app
    networks:
      - aid-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy

  # Gradio UI 服务（可选）
  aid-agent-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aid-agent-ui
    restart: unless-stopped
    user: "0"
    ports:
      - "${GRADIO_PORT:-7860}:7860"
    env_file:
      - .env
    environment:
      - SERVER_MODE=gradio
      - SERVER_PORT=7860
      - DEBUG=true
    volumes:
      - .:/app
    networks:
      - aid-network
    profiles:
      - ui
    depends_on:
      postgres:
        condition: service_healthy

networks:
  aid-network:
    driver: bridge

volumes:
  postgres_data:
