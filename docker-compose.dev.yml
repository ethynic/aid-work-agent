# AID Work Agent 在线开发环境。用于各种第三方系统对接的调试，本地开发环境无法提供回调链接。发版周期是随时。
# 注意1，本环境使用独立数据库 aid_work_agent3 / aid_work_logs3（2026-10-29 拆库，
# 此前与在线测试环境共用 aid_work_agent2 导致 Runner lease 池跨环境抢任务而停用）。
# 测试数据通过 deploy/test2dev.sh 从 aid_work_agent2 单向同步，渠道配置各环境独立。
# 注意2，本环境有独立的 background_runner（aid-agent-background3），只处理本环境库的
# scheduled_tasks 等定时任务，与 agent2 互不干扰（拆库前共库双触发是当年不加 background 的原因）。
# 注意3，uploads/storage 宿主目录仍与测试环境共享（agent2_uploads / agent2_storage），
# test2dev.sh 同步来的数据引用的附件文件直接可见，无需复制附件。

services:
  # FastAPI 后端服务
  aid-agent-api:
    build:
      context: .
      dockerfile: Dockerfile
      # 不锁定基础镜像 digest（理由见 Dockerfile 注释）
      # 兜底：/tmp tmpfs mount (mode=1777) + fix_tmp.sh (entrypoint)
    image: aid-agent-api:latest
    container_name: aid-agent-api3
    restart: unless-stopped
    
    # 端口映射（避免与生产环境 8000 冲突）
    ports:
      - "${API_PORT:-8004}:8000"
    
    # 环境变量
    env_file:
      - .env
    environment:
      # 服务模式（固定值）
      - SERVER_MODE=fastapi
      - SERVER_PORT=8000
      # Gunicorn 配置
      - WORKERS=${WORKERS:-2}
      - WORKER_TIMEOUT=${WORKER_TIMEOUT:-120}
      # 调试模式（测试环境必须为 false）
      - DEBUG=${DEBUG:-false}
      # 其他配置
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

    # Volume 挂载 - 实现代码热更新
    volumes:
      # 挂载整个项目目录到容器（关键：实现代码热更新）
      - .:/app

      # 日志目录（独立挂载，便于查看）
      - ./log:/app/log

      # 配置文件（独立挂载，便于修改）
      - ./configs:/app/configs

      # Skills 目录（独立挂载，便于添加新技能）
      - ./skills:/app/skills

      # /tmp 权限兜底：debian trixie-slim 上游某次更新导致 /tmp 默认 mode 变成 755，
      # Playwright 启动 Chromium 时写 /tmp 失败。挂一个 mode=1777 的 tmpfs 强制覆盖。
      # （和 postgres 容器同一根因：底层 Debian 镜像 tmpfs 配置变化）
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 1777
          size: 200m

      # 上传附件目录（独立目录，避免与生产环境冲突）
      - /var/www/qb3_upload/agent2_uploads:/app/uploads
      - /var/www/qb3_upload/agent2_storage:/app/storage
      # 用于数据迁移
      - /var/www/qb3_upload/agent_storage:/app/source_storage
    
    # 网络配置（使用独立网络名称，避免与生产环境冲突）
    networks:
      - aid-network3
    
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 后台定时任务服务：只处理本环境库（aid_work_agent3）的 scheduled_tasks 等定时任务。
  # 2026-10-29 拆库后与 agent2 的 background（处理 aid_work_agent2）彻底隔离，恢复部署。
  # 健康检查的 .bg_runner_alive 心跳文件路径固定为 storage/.bg_runner_alive，而本环境
  # storage 与 agent2 共享宿主目录，两环境心跳写同一文件——本健康检查可能被 agent2 的
  # 心跳掩盖（反之亦然），background3 实际状态以 docker logs aid-agent-background3 为准。
  aid-agent-background:
    build:
      context: .
      dockerfile: Dockerfile
    image: aid-agent-api:latest
    container_name: aid-agent-background3
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - SERVER_MODE=background
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    entrypoint: ["sh", "-c"]
    command: ["/usr/local/bin/fix_tmp.sh && exec gosu appuser python -m src.background_runner"]
    volumes:
      - .:/app
      - ./log:/app/log
      - ./configs:/app/configs
      - ./skills:/app/skills
      # 与本环境主 API 共享业务存储（测试/开发共用 agent2_* 宿主目录）
      - /var/www/qb3_upload/agent2_uploads:/app/uploads
      - /var/www/qb3_upload/agent2_storage:/app/storage
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 1777
          size: 200m
    networks:
      - aid-network3
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /app/storage/.bg_runner_alive -mmin -2 2>/dev/null)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# 网络配置（独立网络，避免与生产环境冲突）
networks:
  aid-network3:
    driver: bridge

# Volume 配置（可选，用于持久化数据）
volumes:
  app-logs:
    driver: local
