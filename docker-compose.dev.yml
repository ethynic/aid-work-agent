# AID Work Agent 在线开发环境 Docker Compose 配置
# 基于 docker-compose.prod.yml 修改，避免与生产环境端口和路径冲突

services:
  # FastAPI 后端服务
  aid-agent-api:
    build:
      context: .
      dockerfile: Dockerfile
      # 不锁定基础镜像 digest（理由见 Dockerfile 注释）
      # 兜底：/tmp tmpfs mount (mode=1777) + fix_tmp.sh (entrypoint)
    image: aid-agent-api:latest
    container_name: aid-agent-api3
    restart: unless-stopped
    
    # 端口映射（避免与生产环境 8000 冲突）
    ports:
      - "${API_PORT:-8004}:8000"
    
    # 环境变量
    env_file:
      - .env
    environment:
      # 服务模式（固定值）
      - SERVER_MODE=fastapi
      - SERVER_PORT=8000
      # Gunicorn 配置
      - WORKERS=${WORKERS:-2}
      - WORKER_TIMEOUT=${WORKER_TIMEOUT:-120}
      # 调试模式（测试环境必须为 false）
      - DEBUG=${DEBUG:-false}
      # 其他配置
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

    # Volume 挂载 - 实现代码热更新
    volumes:
      # 挂载整个项目目录到容器（关键：实现代码热更新）
      - .:/app

      # 日志目录（独立挂载，便于查看）
      - ./log:/app/log

      # 配置文件（独立挂载，便于修改）
      - ./configs:/app/configs

      # Skills 目录（独立挂载，便于添加新技能）
      - ./skills:/app/skills

      # /tmp 权限兜底：debian trixie-slim 上游某次更新导致 /tmp 默认 mode 变成 755，
      # Playwright 启动 Chromium 时写 /tmp 失败。挂一个 mode=1777 的 tmpfs 强制覆盖。
      # （和 postgres 容器同一根因：底层 Debian 镜像 tmpfs 配置变化）
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 1777
          size: 200m

      # 上传附件目录（独立目录，避免与生产环境冲突）
      - /var/www/qb3_upload/agent3_uploads:/app/uploads
      - /var/www/qb3_upload/agent3_storage:/app/storage
      # 用于数据迁移
      - /var/www/qb3_upload/agent_storage:/app/source_storage
    
    # 网络配置（使用独立网络名称，避免与生产环境冲突）
    networks:
      - aid-network3
    
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # 资源限制（生产环境推荐配置）
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"

# 网络配置（独立网络，避免与生产环境冲突）
networks:
  aid-network3:
    driver: bridge

# Volume 配置（可选，用于持久化数据）
volumes:
  app-logs:
    driver: local
