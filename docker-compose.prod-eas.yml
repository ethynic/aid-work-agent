# AID Work Agent 生产环境 Docker Compose 配置
# 优化用于生产环境部署

services:
  # FastAPI 后端服务
  aid-agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aid-agent-api:latest
    container_name: aid-agent-api
    restart: unless-stopped
    
    # 端口映射
    ports:
      - "${API_PORT:-8000}:8000"
    
    # 环境变量
    environment:
      # 服务模式
      - SERVER_MODE=fastapi
      - SERVER_PORT=8000
      
      # Gunicorn 配置
      # 当前服务器 4 核，workers = 2×4+1 = 9
      - WORKERS=${WORKERS:-9}
      - WORKER_TIMEOUT=${WORKER_TIMEOUT:-120}
      
      # LLM 配置
      - LLM_PROVIDER=${LLM_PROVIDER:-qwen}
      - API_KEYS=${API_KEYS}
      - BASE_URL=${BASE_URL}
      - MODEL_CODE=${MODEL_CODE}
      
      # 调试模式（生产环境必须为 false）
      - DEBUG=${DEBUG:-false}
      
      # 企业微信渠道
      - WECOM_ENABLED=${WECOM_ENABLED:-false}
      - WECOM_CORP_ID=${WECOM_CORP_ID}
      - WECOM_AGENT_ID=${WECOM_AGENT_ID}
      - WECOM_SECRET=${WECOM_SECRET}
      - WECOM_TOKEN=${WECOM_TOKEN}
      - WECOM_ENCODING_AES_KEY=${WECOM_ENCODING_AES_KEY}
      
      # 钉钉渠道
      - DINGTALK_ENABLED=${DINGTALK_ENABLED:-false}
      - DINGTALK_APP_KEY=${DINGTALK_APP_KEY}
      - DINGTALK_APP_SECRET=${DINGTALK_APP_SECRET}
      - DINGTALK_TOKEN=${DINGTALK_TOKEN}
      - DINGTALK_ENCODING_AES_KEY=${DINGTALK_ENCODING_AES_KEY}
      
      # 飞书渠道
      - FEISHU_ENABLED=${FEISHU_ENABLED:-false}
      - FEISHU_APP_ID=${FEISHU_APP_ID}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET}
      - FEISHU_VERIFICATION_TOKEN=${FEISHU_VERIFICATION_TOKEN}
      - FEISHU_ENCRYPT_KEY=${FEISHU_ENCRYPT_KEY}
      
      # 邮件工具
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - IMAP_SERVER=${IMAP_SERVER}
      - IMAP_PORT=${IMAP_PORT:-993}
      
      # 搜索工具
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      
      # OCR 工具
      - BAIDU_OCR_API_KEY=${BAIDU_OCR_API_KEY}
      - BAIDU_OCR_SECRET_KEY=${BAIDU_OCR_SECRET_KEY}
      
      # EAS 合同核对 - SMB 共享目录配置
      - EAS_API_URL=${EAS_API_URL:-https://dc.trendzone.com.cn/manage/api/eas_auto_contAttach}
      - SMB_SERVER=${SMB_SERVER:-192.168.200.10}
      - SMB_SHARE_NAME=${SMB_SHARE_NAME:-AIUpload}
      - SMB_USERNAME=${SMB_USERNAME:-aiupload}
      - SMB_PASSWORD=${SMB_PASSWORD}
      - SMB_MOUNT_POINT=${SMB_MOUNT_POINT:-/mnt/smb/AIUpload}

      # OA 审批配置（contract-approval Skill）
      - CONTRACT_OA_URL=${CONTRACT_OA_URL}
      - CONTRACT_OA_USERNAME=${CONTRACT_OA_USERNAME}
      - CONTRACT_OA_PASSWORD=${CONTRACT_OA_PASSWORD}
      - CONTRACT_OA_HEADLESS=${CONTRACT_OA_HEADLESS:-false}

      # 其他配置
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    
    # Volume 挂载 - 实现代码热更新
    volumes:
      # 挂载整个项目目录到容器（关键：实现代码热更新）
      - .:/app
      
      # 日志目录（独立挂载，便于查看）
      - ./log:/app/log
      
      # 配置文件（独立挂载，便于修改）
      - ./configs:/app/configs
      
      # Skills 目录（独立挂载，便于添加新技能）
      - ./skills:/app/skills

      # 上传附件目录
      - /home/ubuntu/aid_data/uploads:/app/uploads
      - /home/ubuntu/aid_data/storage:/app/storage

      # 记忆文件目录
      - /home/ubuntu/aid_data/memories:/app/memories

      # SMB 共享目录（EAS 合同核对使用）
      # 宿主机需预先挂载 SMB 共享：mount.cifs //192.168.200.10/AIUpload /mnt/smb/AIUpload -o username=aiupload,password=***
      # 然后将宿主机挂载点映射到容器内
      - ${SMB_MOUNT_POINT:-/mnt/smb/AIUpload}:${SMB_MOUNT_POINT:-/mnt/smb/AIUpload}
    
    # 网络配置
    networks:
      - aid-network
    
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # 资源限制（生产环境推荐配置）
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# 网络配置
networks:
  aid-network:
    driver: bridge

# Volume 配置（可选，用于持久化数据）
volumes:
  app-logs:
    driver: local
