# AID Work Agent 生产环境 Docker Compose 配置
# 优化用于生产环境部署

version: '3.8'

services:
  # FastAPI 后端服务
  aid-agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aid-agent-api:latest
    container_name: aid-agent-api
    restart: unless-stopped
    
    # 端口映射
    ports:
      - "${API_PORT:-8000}:8000"
    
    # 环境变量
    env_file:
      - .env
    environment:
      # 服务模式（固定值）
      - SERVER_MODE=fastapi
      - SERVER_PORT=8000
      # Gunicorn 配置
      - WORKERS=${WORKERS:-9}
      - WORKER_TIMEOUT=${WORKER_TIMEOUT:-120}
      # 调试模式（生产环境必须为 false）
      - DEBUG=${DEBUG:-false}
      # 其他配置
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

    # Volume 挂载 - 实现代码热更新
    volumes:
      # 挂载整个项目目录到容器（关键：实现代码热更新）
      - .:/app
      
      # 日志目录（独立挂载，便于查看）
      - ./log:/app/log
      
      # 配置文件（独立挂载，便于修改）
      - ./configs:/app/configs
      
      # Skills 目录（独立挂载，便于添加新技能）
      - ./skills:/app/skills

      # 上传附件目录
      - /var/www/qb3_upload/agent_uploads:/app/uploads
      - /var/www/qb3_upload/agent_storage:/app/storage
      # 用于数据迁移
      - /var/www/qb3_upload/agent2_storage:/app/source_storage

      # 记忆文件目录
      - /var/www/qb3_upload/agent_memories:/app/memories
    
    # 网络配置
    networks:
      - aid-network
    
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # 资源限制（生产环境推荐配置）
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# 网络配置
networks:
  aid-network:
    driver: bridge

# Volume 配置（可选，用于持久化数据）
volumes:
  app-logs:
    driver: local
