# AID Work Agent 配置文件
# V1.0 MVP版本

app:
  name: aid-work-agent
  version: 1.0.0
  debug: false
  host: "0.0.0.0"
  port: 8000

# LLM配置
llm:
  provider: qwen  # qwen | zhipu
  qwen:
    api_key: ${QWEN_API_KEY}
    model: qwen-plus
  zhipu:
    api_key: ${ZHIPU_API_KEY}
    model: glm-4

# 渠道配置
channels:
  wecom:
    corp_id: ${WECOM_CORP_ID}
    agent_id: ${WECOM_AGENT_ID}
    secret: ${WECOM_SECRET}
    token: ${WECOM_TOKEN}
    encoding_aes_key: ${WECOM_ENCODING_AES_KEY}

# 工具配置
tools:
  email:
    smtp_server: ${SMTP_SERVER}
    smtp_port: 465
    smtp_user: ${SMTP_USER}
    smtp_password: ${SMTP_PASSWORD}
    imap_server: ${IMAP_SERVER}
    imap_port: 993
  ocr:
    provider: baidu
    baidu_api_key: ${BAIDU_OCR_API_KEY}
    baidu_secret_key: ${BAIDU_OCR_SECRET_KEY}
  search:
    tavily_api_key: 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
    max_results: 5
    include_answer: true
    search_depth: basic

# 记忆配置
memory:
  short_term:
    max_messages: 10
    ttl: 3600

# 认证配置
auth:
  enabled: true
  default_role: employee
