# AID Work Agent 配置文件
# V1.0 MVP版本

app:
  name: aid-work-agent
  version: 1.0.0
  debug: false
  host: "0.0.0.0"
  port: 8000

# LLM配置
llm:
  provider: zhipu  # qwen | zhipu
  qwen:
    # 多 Key 配置（生产推荐）：在 .env 中设置 QWEN_API_KEYS=key1,key2,key3
    api_keys: ${QWEN_API_KEYS}
    model: qwen-plus
    max_concurrent_per_key: 2   # 每个 Key 最大并发数
    queue_timeout: 30            # 等待可用 Key 的超时秒数
  zhipu:
    # 多 Key 配置（生产推荐）：在 .env 中设置 ZHIPU_API_KEYS=key1,key2,key3
    api_keys: ${ZHIPU_API_KEYS}
    model: glm-4
    max_concurrent_per_key: 2   # 每个 Key 最大并发数
    queue_timeout: 30            # 等待可用 Key 的超时秒数

# 渠道配置
channels:
  # 企业微信
  wecom:
    enabled: false  # 设置为true启用
    corp_id: ${WECOM_CORP_ID}
    agent_id: ${WECOM_AGENT_ID}
    secret: ${WECOM_SECRET}
    token: ${WECOM_TOKEN}
    encoding_aes_key: ${WECOM_ENCODING_AES_KEY}

  # 钉钉
  dingtalk:
    enabled: false  # 设置为true启用
    app_key: ${DINGTALK_APP_KEY}
    app_secret: ${DINGTALK_APP_SECRET}
    token: ${DINGTALK_TOKEN}
    encoding_aes_key: ${DINGTALK_ENCODING_AES_KEY}

  # 飞书
  feishu:
    enabled: false  # 设置为true启用
    app_id: ${FEISHU_APP_ID}
    app_secret: ${FEISHU_APP_SECRET}
    verification_token: ${FEISHU_VERIFICATION_TOKEN}
    encrypt_key: ${FEISHU_ENCRYPT_KEY}

# 工具配置
tools:
  email:
    smtp_server: ${SMTP_SERVER}
    smtp_port: 465
    smtp_user: ${SMTP_USER}
    smtp_password: ${SMTP_PASSWORD}
    imap_server: ${IMAP_SERVER}
    imap_port: 993
  ocr:
    provider: baidu
    baidu_api_key: ${BAIDU_OCR_API_KEY}
    baidu_secret_key: ${BAIDU_OCR_SECRET_KEY}
  search:
    tavily_api_key: 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
    max_results: 5
    include_answer: true
    search_depth: basic
  browser:
    headless: false  # 测试时使用有头模式，实际部署时可改为true
    timeout: 30000  # 默认超时时间（毫秒）
    viewport_width: 1920
    viewport_height: 1080

# 记忆配置
memory:
  short_term:
    max_messages: 10
    ttl: 3600

# 认证配置
auth:
  enabled: true
  default_role: employee

# 管理员配置
admin:
  phones:
    - "13817140566"                       # 管理员手机号列表（用于数字员工管理等后台操作鉴权）
    - "18117370416"
    - "13916807580"
    - "13701602974"
    - "13916323347"
    - "18516330869"

# Skill 配置
skills:
  # 多目录发现（优先级从低到高，高优先级目录覆盖同名 skill）
  # AgentSkills 标准支持多级发现
  directories:
    - src/skills/
    # - storage/skills/enterprise/  # 企业级 skill（取消注释启用）

  # 安全配置
  security:
    allow_dynamic_context: false  # 动态上下文注入 (!`command`)，企业环境建议关闭
    allow_hooks: true             # 生命周期 hooks (onLoad/onUnload)

  # 主智能体允许使用的 skills 列表
  # 如果为空列表，则允许使用所有 skills
  master_agent:
    allowed:
      - paddleocr-doc-parsing
      - weather
      - article-writing
      - contract-approval
      - word-processing
      - excel-data-assitant
  # 子智能体默认配置（可在 SUBAGENT.md 中覆盖）
  subagent:
    default_allowed:
      - paddleocr-doc-parsing

# 定时任务配置
scheduler:
  enabled: true
  timezone: "Asia/Shanghai"
  max_tasks_per_user: 5
  default_max_retries: 3
  execution_timeout: 300
  coalesce_missed: true
  misfire_grace_time: 300
