# AID Work Agent 配置文件
# V1.0 MVP版本

app:
  name: aid-work-agent
  version: 1.0.0
  debug: false
  llm_debug: false
  host: "0.0.0.0"
  port: 8000

# LLM配置
llm:
  provider: zhipu  # qwen | zhipu | deepseek | ...
  qwen:
    # 统一环境变量：在 .env 中设置 API_KEYS=key1,key2,key3
    api_keys: ${API_KEYS}
    model: ${MODEL_CODE}
    base_url: ${BASE_URL}
    max_concurrent_per_key: 2   # 每个 Key 最大并发数
    queue_timeout: 30            # 等待可用 Key 的超时秒数
  zhipu:
    # 统一环境变量：在 .env 中设置 API_KEYS=key1,key2,key3
    api_keys: ${API_KEYS}
    model: ${MODEL_CODE}
    base_url: ${BASE_URL}
    max_concurrent_per_key: 2   # 每个 Key 最大并发数
    queue_timeout: 30            # 等待可用 Key 的超时秒数
  deepseek:
    api_keys: ${DEEPSEEK_API_KEYS}
    model: ${DEEPSEEK_MODEL_CODE:-deepseek-v4-flash}
    base_url: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
    max_concurrent_per_key: 2
    queue_timeout: 30

# 工具配置
tools:
  email:
    smtp_server: ${SMTP_SERVER}
    smtp_port: 465
    smtp_user: ${SMTP_USER}
    smtp_password: ${SMTP_PASSWORD}
    imap_server: ${IMAP_SERVER}
    imap_port: 993
  ocr:
    provider: baidu
    baidu_api_key: ${BAIDU_OCR_API_KEY}
    baidu_secret_key: ${BAIDU_OCR_SECRET_KEY}
  search:
    tavily_api_key: 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
    max_results: 5
    include_answer: true
    search_depth: basic
  browser:
    headless: false  # 测试时使用有头模式，实际部署时可改为true
    timeout: 30000  # 默认超时时间（毫秒）
    viewport_width: 1920
    viewport_height: 1080
  maps:
    amap_api_key: ${AMAP_API_KEY}

# 记忆配置
memory:
  short_term:
    max_messages: 100
    ttl: 3600
  cleanup_interval: 300  # 过期会话清理间隔（秒），默认5分钟

# Redis 配置
redis:
  enabled: ${REDIS_ENABLED:-false}
  host: ${REDIS_HOST:-localhost}
  port: ${REDIS_PORT:-6379}
  password: ${REDIS_PASSWORD:-}
  db: ${REDIS_DB:-0}
  ssl: ${REDIS_SSL:-false}

# 认证配置
auth:
  enabled: true
  default_role: employee
  max_concurrent_tokens: 10

# 平台管理员配置
admin:
  phones:
    - "13817140566"                       # 平台管理员手机号列表（用于登录数字员工管理后台）
    - "18117370416"
    - "13916807580"
    - "13701602974"
    - "13916323347"
    - "18516330869"

# Skill 配置
skills:
  # 多目录发现（优先级从低到高，高优先级目录覆盖同名 skill）
  # AgentSkills 标准支持多级发现
  directories:
    - src/skills/
    # - storage/skills/enterprise/  # 企业级 skill（取消注释启用）

  # 安全配置
  security:
    allow_dynamic_context: false  # 动态上下文注入 (!`command`)，企业环境建议关闭
    allow_hooks: true             # 生命周期 hooks (onLoad/onUnload)

  # 主智能体允许使用的 skills 列表
  # 如果为空列表，则允许使用所有 skills
  master_agent:
    allowed:
      - paddleocr-doc-parsing
      - weather
      - article-writing
      - contract-approval
      # word-processing 已迁移为 word_process 工具（src/tools/word/）
      - excel-data-assitant
      - trip-planner
      - quote-generator
      - quote-export
      - route-distance
  # 子智能体默认配置（可在 SUBAGENT.md 中覆盖）
  subagent:
    default_allowed:
      - paddleocr-doc-parsing
      - route-distance

# SaaS 多租户配置
saas:
  enabled: ${SAAS_ENABLED:-false}
  tenant_skills_dir: "tenants"
  default_max_instances: 5
  default_max_users: 50
  # 租户代码配置
  tenant_code:
    pattern: "^[A-Z0-9]{4,8}$"  # 正则表达式模式
    min_length: 4
    max_length: 8

# 演示模式配置
demo:
  enabled: ${DEMO_ENABLED:-true}
  mock_password: "888888"

# 存储配置（所有业务数据集中于此，便于备份和迁移）
storage:
  base_dir: "storage"
  uploads_dir: "storage/uploads"
  memories_dir: "storage/memories"

# 定时任务配置
scheduler:
  enabled: true
  timezone: "Asia/Shanghai"
  max_tasks_per_user: 5
  default_max_retries: 3
  execution_timeout: 300
  coalesce_missed: true
  misfire_grace_time: 300
