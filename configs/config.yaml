# AID Work Agent 配置文件
# V1.0 MVP版本

app:
  name: aid-work-agent
  version: 1.0.0
  debug: false
  llm_debug: false
  host: "0.0.0.0"
  port: 8000

# 聊天输入框全局默认配置
# 子智能体未声明 upload_accept 时走此默认值（与 ChatInput.vue 硬编码 accept 保持一致）
chat:
  default_upload_accept: "image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.txt,.png,.jpg,.jpeg,.gif,.ppt,.pptx"

# 智能体全局配置
agent:
  reply_style: human-like  # 默认回复风格 ID，对应 src/prompts/styles/{style_id}.md
  # 用户可见中间消息（verbose）配置（Phase 1，docs/system/agent-intermediate-feedback-design.md §11）
  # 2026-09-01 产品决策：全局默认启用；force_disabled=true 为最高优先级 kill switch
  # （紧急回滚用，覆盖请求级/渠道级/旧 waiting_indicator 全部配置，修改后需重启生效）。
  # 文案仅来自工具/Skill/delegate 等策略，无系统兜底（system watchdog 已删除）；
  # fallback_message 仅作 policy 文案违规时的降级模板。
  verbose_feedback:
    force_disabled: false
    enabled: true
    max_per_turn: 1
    max_text_chars: 60
    delivery_timeout_seconds: 5
    fallback_message: "正在处理你的请求，复杂任务可能需要一点时间，请耐心等待。"

# LLM配置
# 主 provider 通过 LLM_PROVIDER + API_KEYS + MODEL_CODE + BASE_URL 四个环境变量统一控制
# 各备用 provider 有独立环境变量（如 DEEPSEEK_*、QWEN_*），用于 failover
llm:
  provider: ${LLM_PROVIDER:-deepseek}
  # 轻量小模型（低成本简单任务：报告/复盘/评分/空态摘要），独立于主链路 model。
  # 写法：
  #   - "provider/model"（如 "qwen/qwen3.7-flash"）：跨 provider 调用，用该 provider 的 key/base_url
  #   - 纯模型名（如 "deepseek-v4-flash"）：用当前主 provider
  # 未配置时 fallback 到主模型 model；详见 docs/research/ai-agent-experience-daily-report-research.md §4.7.6
  lite_model: ${LITE_MODEL_CODE:-}
  # qwen 推理模型（qwen3.x-flash/plus 系）是否关闭思考模式；默认 false（关闭思考，1-2s 响应）。
  # 仅 qwen provider 的 qwen 系模型生效；置 None 时不写该参数（不影响非 qwen 推理模型）
  enable_thinking: false
  # 是否启用显式缓存（cache_control: ephemeral）。仅 qwen provider 的 qwen 系模型生效，
  # 命中按输入单价 10% 计费（百炼官方），有效 5 分钟
  context_cache: true
  # 各模型 max_tokens 上限（调用方未显式指定 max_tokens 时，按当前生效模型查此表作为默认值）
  # 数据来源：阿里云百炼平台官方文档（2026-08）
  model_max_tokens:
    qwen-vl-plus: 8192
    qwen-vl-max: 8192
    qwen3.7-plus: 131072
    qwen3-vl-flash: 32768
  qwen:
    api_keys: ${QWEN_API_KEYS:-}
    model: ${QWEN_MODEL_CODE:-qwen3.7-flash}
    base_url: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
    max_concurrent_per_key: 2
    queue_timeout: 30
  zhipu:
    api_keys: ${ZHIPU_API_KEYS:-}
    model: ${ZHIPU_MODEL_CODE:-GLM-5.3-Flash}
    base_url: ${ZHIPU_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
    max_concurrent_per_key: 2
    queue_timeout: 30
  deepseek:
    api_keys: ${DEEPSEEK_API_KEYS:-}
    model: ${DEEPSEEK_MODEL_CODE:-deepseek-v4-flash}
    base_url: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
    max_concurrent_per_key: 2
    queue_timeout: 30
  # Moonshot（Kimi）：仅供客户端代理端点按 model 白名单显式路由（weixin-cli kimi-k3 视觉定位，
  # 见 docs/design/weixin/weixin-cli-billing.md），不参与主链路 provider/failover 默认值
  moonshot:
    api_keys: ${MOONSHOT_API_KEYS:-}
    model: ${MOONSHOT_MODEL_CODE:-kimi-k3}
    base_url: ${MOONSHOT_BASE_URL:-https://api.moonshot.cn/v1}
    max_concurrent_per_key: 2
    queue_timeout: 30
  failover:
    enabled: ${LLM_FAILOVER_ENABLED:-true}   # 是否启用 failover（通过 .env 的 LLM_FAILOVER_ENABLED 控制，生产环境建议 true）
    providers:                    # failover 优先级链（不含主 provider）
      - qwen
    retry:
      max_retries: 2              # 同一 provider 内重试次数
      retry_delay: 1.0            # 重试间隔（秒）
    circuit_breaker:
      failure_threshold: 3        # 连续失败 N 次触发熔断
      recovery_timeout: 60        # 熔断恢复时间（秒）
    alert:
      enabled: true               # 是否启用告警
      channel: webhook            # 告警渠道
      cooldown: 300               # 告警冷却时间（秒）

# 视频生成配置（多 provider：wanx / minimax，由 VIDEO_GEN_PROVIDER 切换）
video_gen:
  provider: ${VIDEO_GEN_PROVIDER:-wanx}    # wanx | minimax
  poll_interval_seconds: 30
  task_max_age_hours: 24                   # 全局兜底；实际以 provider 声明为准
  wanx:
    api_key: ${WANX_API_KEY:-}             # 空：回退 qwen.api_keys[0]（同百炼账号通用）
    model: wan2.7-r2v                            # 稳定别名，百炼自动指向最新小版本（与 token_cost_prices.model_name 严格相等）
    poll_interval_seconds: 30
    task_max_age_hours: 24                  # 万相 task_id 查询有效期
  minimax:
    api_key: ${MINIMAX_API_KEY:-}           # 必须独立配置（不与 Qwen 共用）
    model: ${MINIMAX_VIDEO_MODEL_CODE:-MiniMax-H3}
    base_url: ${MINIMAX_BASE_URL:-https://api.minimaxi.com}
    poll_interval_seconds: 30
    task_max_age_hours: 168                 # MiniMax 7 天查询窗口

# 工具配置
tools:
  email:
    smtp_server: ${SMTP_SERVER}
    smtp_port: 465
    smtp_user: ${SMTP_USER}
    smtp_password: ${SMTP_PASSWORD}
    imap_server: ${IMAP_SERVER}
    imap_port: 993
  ocr:
    provider: baidu
    baidu_api_key: ${BAIDU_OCR_API_KEY}
    baidu_secret_key: ${BAIDU_OCR_SECRET_KEY}
  search:
    tavily_api_key: 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
    max_results: 5
    include_answer: true
    search_depth: basic
  browser:
    headless: true  # 服务端默认使用无头模式，与 BrowserToolConfig 默认值保持一致
    timeout: 30000  # 默认超时时间（毫秒）
    task_timeout: 300  # 单次工具总超时（秒）
    command_timeout: 30  # worker 单命令超时（秒）
    owner_lease_ttl: 30  # owner lease TTL（秒）
    owner_renew_interval: 10  # owner lease 续租间隔（秒）
    reaper_interval: 15  # 过期 run 回收周期（秒）
    viewport_width: 1920
    viewport_height: 1080
  maps:
    amap_api_key: ${AMAP_API_KEY}

# 记忆配置
memory:
  short_term:
    max_messages: 200
    ttl: 3600
  mid_term:
    # 会话内上下文压缩（详见 docs/infrastructure/memory/context_compression_design.md）
    enabled: true
    # 触发条件（双阈值，任一满足即触发）
    token_threshold_ratio: 0.7       # token 主阈值：占模型上下文上限的比例
    message_count_threshold: 200     # 消息数兜底阈值（含工具消息）；缓存=0 时靠它兜底极端长会话
    # 分段保留
    header_keep: 3                   # 头部保留消息数
    tail_keep: 30                    # 尾部保留消息数（按工具链边界对齐）
    # 摘要 LLM
    summary_max_tokens: 1500
    summary_llm_retry: 2             # 摘要 LLM 调用重试次数
    summary_llm:
      provider: deepseek             # 走便宜模型
      model: deepseek-chat
      timeout_sec: 30
    # 工具结果预处理
    large_tool_result_truncate_chars: 2000
    # 后台定时任务扫描（Phase 8 §2.5 补漏机制）
    background_scan_enabled: false     # 默认关闭，上线后按需开启
    background_scan_interval_sec: 600  # 扫描周期，默认 10 分钟
    background_scan_batch_size: 50     # 单次扫描最多处理 session 数
  long_term:
    enabled: true           # 是否启用长期记忆
    storage_dir: "storage/memory"    # 记忆文件根目录，实际文件在 storage/memory/{tenant_id}/ 下
    summary_cron: "0 2 * * *"        # 每日自动总结执行时间
    max_users_per_run: 50            # 单次总结最多处理用户数
    max_inject_tokens: 2000          # 注入上下文的最大 token 数
  cleanup_interval: 300  # 过期会话清理间隔（秒），默认5分钟

# Redis 配置
redis:
  enabled: ${REDIS_ENABLED:-false}
  host: ${REDIS_HOST:-localhost}
  port: ${REDIS_PORT:-6379}
  password: ${REDIS_PASSWORD:-}
  db: ${REDIS_DB:-0}
  ssl: ${REDIS_SSL:-false}

# 认证配置
auth:
  enabled: true
  default_role: employee
  max_concurrent_tokens: 10

# 平台管理员配置
admin:
  phones:
    - "13817140566"                       # 平台管理员手机号列表（用于登录数字员工管理后台）
    - "18117370416"
    - "13916807580"
    - "13701602974"
    - "13916323347"
    - "18516330869"

# Skill 配置
skills:
  # 多目录发现（优先级从低到高，高优先级目录覆盖同名 skill）
  # AgentSkills 标准支持多级发现
  directories:
    - src/skills/
    # - storage/skills/enterprise/  # 企业级 skill（取消注释启用）

  # 安全配置
  security:
    allow_dynamic_context: false  # 动态上下文注入 (!`command`)，企业环境建议关闭
    allow_hooks: true             # 生命周期 hooks (onLoad/onUnload)

  # 主智能体允许使用的 skills 列表
  # 如果为空列表，则允许使用所有 skills
  master_agent:
    allowed:
      - paddleocr-doc-parsing
      - weather
      - article-writing
      - contract-approval
      - travel-quote
      - route-distance
      - sms-verification
      - excel-to-template
  # 子智能体默认配置（可在 SUBAGENT.md 中覆盖）
  subagent:
    default_allowed:
      - paddleocr-doc-parsing
      - route-distance

# SaaS 多租户配置
saas:
  tenant_skills_dir: "storage/tenants"
  default_max_instances: 5
  default_max_users: 50
  # 租户代码配置
  tenant_code:
    pattern: "^[A-Z0-9]{4,8}$"  # 正则表达式模式
    min_length: 4
    max_length: 8

# 存储配置（所有业务数据集中于此，便于备份和迁移）
storage:
  base_dir: "storage"

# 定时任务配置
scheduler:
  enabled: true
  timezone: "Asia/Shanghai"
  max_tasks_per_user: 5
  default_max_retries: 3
  execution_timeout: 300
  coalesce_missed: true
  misfire_grace_time: 300

# MCP Server 配置（Model Context Protocol）
mcp:
  enabled: ${MCP_ENABLED:-false}
  transport: ${MCP_TRANSPORT:-sse}   # stdio | sse | streamable-http
  host: ${MCP_HOST:-0.0.0.0}
  port: ${MCP_PORT:-8765}
  auth:
    enabled: ${MCP_AUTH_ENABLED:-true}
    api_keys: []                     # API Key 列表，或通过环境变量 MCP_API_KEYS 设置（逗号分隔）
  tools: []                          # 暴露的 skill/tool 列表，示例：
  #  - skill: trade-customer
  #    commands: [save-customer, search-customers]
  #  - skill: baidu-search
  #    commands: [search]

# 企业微信渠道配置
# 通知服务配置
notification:
  enabled: true
  default_channel: "email"
  channels:
    email:
      enabled: true
    webhook:
      enabled: false
      default_url: ""

# 积分计费配置（#37 租户积分充值与计费）
billing:
  usage_factor: 100  # 用量系数，token 成本价 × 系数 = 积分用量（向上取整）
  video_gen_usage_factor: 33  # 视频创作用量系数（3.3 倍加价），视频秒数 × 单价 × 此系数 = 积分用量
  embedding_usage_factor: 100  # 向量模型用量系数，embedding token × 单价 × 系数 = 积分用量（知识库向量化/检索 query 向量化）
  asr_usage_factor: 100  # 语音识别用量系数，ASR 调用次数 × 单价 × 系数 = 积分用量（阿里云 NLS 按次计费）

boss_tool_billing:
  # BOSS 本地工具按次计费（2026-08-31）：成功调用才扣，失败/超时不扣；与 LLM token 计费独立
  # 改价直接改下表（积分数值可带小数），价格设 0 = 免费；enabled: false 全部免费
  enabled: true
  default_credit_price: 0.0  # 未列出工具的单次价格
  tool_credit_prices:
    boss_greet: 1.0            # 打招呼（消耗 BOSS 开聊权益）
    boss_send_to: 1.0          # 发消息（真实触达候选人）
    boss_send_current: 1.0     # 当前会话发消息
    boss_accept_resume: 1.0    # 接收简历
    boss_reject_current: 0.5   # 标记不合适
    boss_resume_detail: 1.0    # 读取简历入库（滚动+截图+OCR 约 30 秒）
    boss_resume_batch: 2.0     # 批量读取（最多 3 份）
    boss_select_job: 0.5       # 切换职位
    boss_filter: 0.5           # 设置筛选
    # 以下工具默认免费（未列出走 default_credit_price）：
    # boss_goto / boss_clear_filter / boss_filter_options / boss_list_jobs /
    # boss_read_chat / boss_open_chat / boss_jobs_list / boss_interview_notify / boss_interview_demo
  # 弹层自愈：工具失败（疑似弹层遮挡）时云端自动「识别弹层→关闭→重试一次」，
  # 用了 LLM 故费用高于单次调用；仅在自愈真正救回操作（重试成功）时收取
  overlay_heal_enabled: true
  overlay_heal_price: 2.0

client_usage_report:
  # 客户端通用用量上报（C 模式，2026-09 客户端计费统一接入 P4）：面向"本地自主执行、
  # 不经服务端下发"的未来客户端，POST /api/client/v1/usage/report 上报事实（命令/参数
  # 摘要/次数），金额由服务端按下表计算，客户端永远不上报金额；client_ref_id 幂等防重。
  # 默认关闭：当前 boss（B 动作模式）与协会采集（A 代理模式）都不走此端点，有真实
  # C 模式客户端接入再开启并配价。
  enabled: false
  default_credit_price: 0.0  # 未列出命令的单次价格（价格设 0 = 免费）
  # command_credit_prices:
  #   "my-client:weixin_add_friend": 1.0   # 带 client_name 前缀：同命令按客户端差异化定价
  #   weixin_send_message: 0.5             # 纯命令名：所有客户端通用

# Desktop Agent D1：默认关闭；启用时必须通过环境变量提供至少 32 字节的签名密钥。
desktop_agent:
  enabled: ${DESKTOP_AGENT_ENABLED:-false}
  authorization_ticket_secret: ${DESKTOP_AGENT_AUTHORIZATION_SECRET:-}
  authorization_ticket_ttl_seconds: 120
  policy_revision: "desktop-d1-v1"
  allowed_remote_tools: []
