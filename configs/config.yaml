# AID Work Agent 配置文件
# V1.0 MVP版本

app:
  name: aid-work-agent
  version: 1.0.0
  debug: false
  llm_debug: false
  host: "0.0.0.0"
  port: 8000

# 智能体全局配置
agent:
  reply_style: human-like  # 默认回复风格 ID，对应 src/prompts/styles/{style_id}.md

# LLM配置
# 主 provider 通过 LLM_PROVIDER + API_KEYS + MODEL_CODE + BASE_URL 四个环境变量统一控制
# 各备用 provider 有独立环境变量（如 DEEPSEEK_*、QWEN_*），用于 failover
llm:
  provider: ${LLM_PROVIDER:-deepseek}
  qwen:
    api_keys: ${QWEN_API_KEYS:-}
    model: ${QWEN_MODEL_CODE:-qwen-plus}
    base_url: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
    max_concurrent_per_key: 2
    queue_timeout: 30
  zhipu:
    api_keys: ${ZHIPU_API_KEYS:-}
    model: ${ZHIPU_MODEL_CODE:-glm-4}
    base_url: ${ZHIPU_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
    max_concurrent_per_key: 2
    queue_timeout: 30
  deepseek:
    api_keys: ${DEEPSEEK_API_KEYS:-}
    model: ${DEEPSEEK_MODEL_CODE:-deepseek-v4-flash}
    base_url: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
    max_concurrent_per_key: 2
    queue_timeout: 30
  failover:
    enabled: true               # 是否启用 failover（生产环境建议 true）
    providers:                    # failover 优先级链（不含主 provider）
      - qwen
    retry:
      max_retries: 2              # 同一 provider 内重试次数
      retry_delay: 1.0            # 重试间隔（秒）
    circuit_breaker:
      failure_threshold: 3        # 连续失败 N 次触发熔断
      recovery_timeout: 60        # 熔断恢复时间（秒）
    alert:
      enabled: true               # 是否启用告警
      channel: webhook            # 告警渠道
      cooldown: 300               # 告警冷却时间（秒）

# 工具配置
tools:
  email:
    smtp_server: ${SMTP_SERVER}
    smtp_port: 465
    smtp_user: ${SMTP_USER}
    smtp_password: ${SMTP_PASSWORD}
    imap_server: ${IMAP_SERVER}
    imap_port: 993
  ocr:
    provider: baidu
    baidu_api_key: ${BAIDU_OCR_API_KEY}
    baidu_secret_key: ${BAIDU_OCR_SECRET_KEY}
  search:
    tavily_api_key: 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
    max_results: 5
    include_answer: true
    search_depth: basic
  browser:
    headless: false  # 测试时使用有头模式，实际部署时可改为true
    timeout: 30000  # 默认超时时间（毫秒）
    viewport_width: 1920
    viewport_height: 1080
  maps:
    amap_api_key: ${AMAP_API_KEY}

# 记忆配置
memory:
  short_term:
    max_messages: 100
    ttl: 3600
  long_term:
    enabled: true           # 是否启用长期记忆
    storage_dir: "storage/memory"    # 记忆文件根目录，实际文件在 storage/memory/{tenant_id}/ 下
    summary_cron: "0 2 * * *"        # 每日自动总结执行时间
    max_users_per_run: 50            # 单次总结最多处理用户数
    max_inject_tokens: 2000          # 注入上下文的最大 token 数
  cleanup_interval: 300  # 过期会话清理间隔（秒），默认5分钟

# Redis 配置
redis:
  enabled: ${REDIS_ENABLED:-false}
  host: ${REDIS_HOST:-localhost}
  port: ${REDIS_PORT:-6379}
  password: ${REDIS_PASSWORD:-}
  db: ${REDIS_DB:-0}
  ssl: ${REDIS_SSL:-false}

# 认证配置
auth:
  enabled: true
  default_role: employee
  max_concurrent_tokens: 10

# 平台管理员配置
admin:
  phones:
    - "13817140566"                       # 平台管理员手机号列表（用于登录数字员工管理后台）
    - "18117370416"
    - "13916807580"
    - "13701602974"
    - "13916323347"
    - "18516330869"

# Skill 配置
skills:
  # 多目录发现（优先级从低到高，高优先级目录覆盖同名 skill）
  # AgentSkills 标准支持多级发现
  directories:
    - src/skills/
    # - storage/skills/enterprise/  # 企业级 skill（取消注释启用）

  # 安全配置
  security:
    allow_dynamic_context: false  # 动态上下文注入 (!`command`)，企业环境建议关闭
    allow_hooks: true             # 生命周期 hooks (onLoad/onUnload)

  # 主智能体允许使用的 skills 列表
  # 如果为空列表，则允许使用所有 skills
  master_agent:
    allowed:
      - paddleocr-doc-parsing
      - weather
      - article-writing
      - contract-approval
      - travel-quote
      - route-distance
      - guizang-ppt-skill
  # 子智能体默认配置（可在 SUBAGENT.md 中覆盖）
  subagent:
    default_allowed:
      - paddleocr-doc-parsing
      - route-distance

# SaaS 多租户配置
saas:
  enabled: ${SAAS_ENABLED:-false}
  tenant_skills_dir: "tenants"
  default_max_instances: 5
  default_max_users: 50
  # 租户代码配置
  tenant_code:
    pattern: "^[A-Z0-9]{4,8}$"  # 正则表达式模式
    min_length: 4
    max_length: 8

# 演示模式配置
demo:
  enabled: ${DEMO_ENABLED:-true}
  mock_password: "888888"

# 存储配置（所有业务数据集中于此，便于备份和迁移）
storage:
  base_dir: "storage"
  uploads_dir: "storage/uploads"
  memories_dir: "storage/memories"

# 定时任务配置
scheduler:
  enabled: true
  timezone: "Asia/Shanghai"
  max_tasks_per_user: 5
  default_max_retries: 3
  execution_timeout: 300
  coalesce_missed: true
  misfire_grace_time: 300

# MCP Server 配置（Model Context Protocol）
mcp:
  enabled: ${MCP_ENABLED:-false}
  transport: ${MCP_TRANSPORT:-sse}   # stdio | sse | streamable-http
  host: ${MCP_HOST:-0.0.0.0}
  port: ${MCP_PORT:-8765}
  auth:
    enabled: ${MCP_AUTH_ENABLED:-true}
    api_keys: []                     # API Key 列表，或通过环境变量 MCP_API_KEYS 设置（逗号分隔）
  tools: []                          # 暴露的 skill/tool 列表，示例：
  #  - skill: trade-customer
  #    commands: [save-customer, search-customers]
  #  - skill: baidu-search
  #    commands: [search]

# 企业微信渠道配置
# 通知服务配置
notification:
  enabled: true
  default_channel: "email"
  channels:
    email:
      enabled: true
    webhook:
      enabled: false
      default_url: ""

wecom:
  waiting_indicator:
    enabled: true
    delay_seconds: 5
    messages:
      - "全力思考中..."
      - "让我推演一下..."
      - "正在筹划，请稍候..."
      - "正在参详您的问题..."
      - "稍等一下下..."
      - "仔细规划中..."
      - "正在检索相关信息..."
      - "请稍等片刻..."
      - "正在为您查询..."
      - "让我核对一下..."
      - "收到，我来看看..."

