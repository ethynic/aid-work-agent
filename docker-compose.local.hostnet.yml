# 本地开发 host 网络模式覆盖文件
# 与 docker-compose.local.yml 叠加使用，让 API 容器直接使用宿主机网络栈。
# 使用条件见 docs/guides/development/local-dev-environments.md「启动与检查」。
#
# API 会脱离 Compose 网络并直接监听宿主机 8000 端口。
# 依赖 postgres、redis、runner-api 等容器 DNS 的本地配置使用默认 bridge。

services:
  aid-agent-api:
    network_mode: host
    # 清空基础文件继承的端口映射与 bridge 网络，否则与 network_mode: host 互斥报错
    ports: !reset []
    networks: !reset []
