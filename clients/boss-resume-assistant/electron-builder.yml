appId: cn.aidingyi.boss.resume
productName: BOSS 简历筛选助手
copyright: Copyright © 2026
asar: true
compression: normal
directories:
  output: release
files:
  - dist/src/main/**
  - dist/src/shared/**
  - dist/db/**
  - dist/renderer/**
  - node_modules/better-sqlite3/**
  - package.json
  - "!**/*.map"
  - "!**/tests/**"
  - "!**/.env*"
  - "!**/*.ts"
protocols:
  - name: BOSS Resume Deep Link
    schemes: [bossresume]
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: BOSS-Resume-Assistant-${version}-win-x64-dev-unsigned.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
