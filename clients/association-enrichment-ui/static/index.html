<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>协会资料调查工作台</title>
  <style>
    :root{--paper:#e9e4d7;--ink:#17201e;--muted:#65706b;--line:#9b9e91;--panel:#f5f1e7;--accent:#e84b2c;--dark:#202a27}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Serif SC","Songti SC",serif}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:repeating-linear-gradient(0deg,transparent 0 23px,#65706b22 24px)}
    header{height:78px;padding:16px 28px;border-bottom:3px solid var(--ink);display:flex;align-items:end;justify-content:space-between}
    h1{font-size:25px;margin:0;letter-spacing:.09em}.serial,.mono,button,input,.event{font-family:"Cascadia Mono","Microsoft YaHei",monospace}
    .serial{font-size:11px;color:var(--muted)}main{display:grid;grid-template-columns:minmax(260px,1fr) minmax(320px,1.25fr) minmax(300px,1.2fr);min-height:calc(100vh - 78px)}
    section{padding:22px;border-right:1px solid var(--line);position:relative}section:last-child{border:0}
    h2{font-size:12px;margin:0 0 18px;text-transform:uppercase;letter-spacing:.2em;border-top:6px solid var(--ink);padding-top:9px}
    textarea{width:100%;height:190px;resize:vertical;background:#fffdf5;border:1px solid var(--ink);padding:13px;font:14px/1.7 "Microsoft YaHei",sans-serif}
    input[type=file]{width:100%;border:1px dashed var(--line);padding:13px;margin:10px 0;background:#ffffff66}
    button,.download{border:0;background:var(--dark);color:white;padding:11px 14px;cursor:pointer;text-decoration:none;font-size:12px}
    button:hover,.download:hover{background:var(--accent)}button:disabled{opacity:.4;cursor:not-allowed}
    .hint{font-size:11px;color:var(--muted);line-height:1.6}.list{margin:17px 0}.item{display:flex;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13px}
    .item button{margin-left:auto;padding:3px 7px;background:transparent;color:var(--accent)}
    .meter{height:16px;border:1px solid var(--ink);margin:16px 0;background:#fff}.meter span{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
    .big{font:42px/1 "Cascadia Mono",monospace}.status{display:inline-block;background:var(--ink);color:#fff;padding:4px 8px;font:11px "Cascadia Mono",monospace}
    .pipeline{margin-top:26px;border-left:2px solid var(--line);padding-left:16px}.now{font-size:17px;margin:8px 0}.event{display:block;width:100%;text-align:left;background:transparent;color:inherit;border:0;border-bottom:1px solid var(--line);padding:10px 0;font-size:11px;line-height:1.5}
    button.event{cursor:pointer}
    .event:hover{color:var(--accent)}.event b{display:block;font-family:"Microsoft YaHei",sans-serif;font-size:12px}.events{max-height:62vh;overflow:auto}
    dialog{width:min(760px,90vw);max-height:80vh;background:var(--panel);border:2px solid var(--ink)}pre{white-space:pre-wrap;word-break:break-word;font:12px/1.6 "Cascadia Mono",monospace}
    .error{color:#b7240d;font-size:12px;min-height:18px;margin-top:10px}
    .tokens{margin-top:24px;border-top:1px solid var(--line);padding-top:12px;font:11px/1.7 "Cascadia Mono",monospace}.tokens table{width:100%;border-collapse:collapse}.tokens th,.tokens td{text-align:right;border-bottom:1px dotted var(--line);padding:4px}.tokens th:first-child,.tokens td:first-child{text-align:left}
    @media(max-width:980px){main{grid-template-columns:1fr}section{border-right:0;border-bottom:1px solid var(--line)}}
    :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  </style>
</head>
<body>
<header><h1>协会资料调查工作台</h1><div class="serial">LOCAL EVIDENCE DESK / 127.0.0.1</div></header>
<main>
  <section>
    <h2>01 / 输入与确认</h2>
    <label for="source" class="hint">协会名称、杂乱名单或说明文字</label>
    <textarea id="source" placeholder="例如：中国游艺机游乐园协会、中国缝制机械协会"></textarea>
    <input id="file" type="file" accept=".csv,.xlsx" aria-label="上传 CSV 或 Excel">
    <button id="parse">模型解析清单</button>
    <p class="hint">模型只可引用输入证据。解析后可删除，不可临时增加。</p>
    <div id="names" class="list"></div>
    <button id="start" disabled>确认并开始调查</button>
    <div id="error" class="error" role="alert"></div>
  </section>
  <section>
    <h2>02 / 串行流水线</h2>
    <span id="status" class="status">待输入</span>
    <div id="meter" class="meter" role="progressbar" aria-label="总体进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="bar"></span></div>
    <div id="percent" class="big">0%</div>
    <div class="pipeline" aria-live="polite">
      <div class="hint">当前协会</div><div id="association" class="now">—</div>
      <div class="hint">当前步骤</div><div id="stage" class="now">等待任务</div>
    </div>
    <div id="tokens" class="tokens"><strong>LLM TOKEN 用量</strong><div id="tokenBatch">尚未调用</div><table><thead><tr><th>协会</th><th>IN</th><th>CACHE</th><th>OUT</th><th>TOTAL</th></tr></thead><tbody id="tokenRows"></tbody></table></div>
    <a id="download" class="download" hidden>下载 Excel</a>
  </section>
  <section>
    <h2>03 / 证据事件流</h2>
    <p class="hint">列表只显示脱敏摘要。点击带详情的事件，在本机按需解密正文。</p>
    <div id="events" class="events" aria-live="polite"></div>
  </section>
</main>
<dialog id="detail"><button id="close">关闭</button><pre id="detailText"></pre></dialog>
<script>
const $=id=>document.getElementById(id);let plan=null,names=[],run=null,timer=null;
function fail(e){$("error").textContent=e?.detail||e?.message||String(e)}
async function api(url,options){const r=await fetch(url,options);const j=await r.json().catch(()=>({detail:r.statusText}));if(!r.ok)throw j;return j}
function drawNames(){$("names").innerHTML="";names.forEach((name,i)=>{const row=document.createElement("div");row.className="item";row.textContent=`${String(i+1).padStart(2,"0")}  ${name}`;const b=document.createElement("button");b.textContent="删除";b.onclick=()=>{names.splice(i,1);drawNames()};row.appendChild(b);$("names").appendChild(row)});$("start").disabled=!names.length}
$("parse").onclick=async()=>{try{$("error").textContent="";const fd=new FormData();fd.append("text",$("source").value);if($("file").files[0])fd.append("upload",$("file").files[0]);const out=await api("/api/parse",{method:"POST",body:fd});plan=out.plan_id;names=out.associations;drawNames()}catch(e){fail(e)}};
$("start").onclick=async()=>{try{const out=await api("/api/runs",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({plan_id:plan,associations:names})});run=out.run_id;$("start").disabled=true;poll()}catch(e){fail(e)}};
async function poll(){try{const x=await api(`/api/runs/${run}`);$("status").textContent=x.status.toUpperCase();$("percent").textContent=x.progress_percent+"%";$("bar").style.width=x.progress_percent+"%";$("meter").setAttribute("aria-valuenow",String(x.progress_percent));$("association").textContent=x.current_association||"—";$("stage").textContent=x.current_stage;drawTokens(x.token_usage);drawEvents(x.events);if(["completed","partial","failed"].includes(x.status)){if(x.output_name){$("download").hidden=false;$("download").href=`/api/runs/${run}/download`}return}}catch(e){fail(e)}timer=setTimeout(poll,1000)}
function drawTokens(data){if(!data)return;const b=data.batch||{},o=data.batch_overhead||{};$("tokenBatch").textContent=`批次 IN ${b.input_tokens||0} / CACHE ${b.cached_input_tokens||0} / OUT ${b.output_tokens||0} / TOTAL ${b.total_tokens||0} · 平均 IN ${b.average_input_tokens||0} / CACHE ${b.average_cached_input_tokens||0} / OUT ${b.average_output_tokens||0} / TOTAL ${b.average_total_tokens||0} · 清单解析 ${o.total_tokens||0}`;const body=$("tokenRows");body.replaceChildren();Object.entries(data.associations||{}).forEach(([name,u])=>{const row=document.createElement("tr");[name,u.input_tokens,u.cached_input_tokens,u.output_tokens,u.total_tokens].forEach(v=>{const cell=document.createElement("td");cell.textContent=String(v??0);row.appendChild(cell)});body.appendChild(row)})}
function drawEvents(events){const box=$("events");box.replaceChildren();[...events].reverse().forEach(e=>{const row=document.createElement(e.detail_ref?"button":"div");if(e.detail_ref)row.type="button";row.className="event";const summary=document.createElement("b");summary.textContent=e.summary||"";row.append(summary,document.createTextNode(`${e.association||"系统"} · ${e.kind||""}`),document.createElement("br"),document.createTextNode((e.timestamp||"").slice(11,19)));if(e.detail_ref)row.onclick=()=>showDetail(e.detail_ref);box.appendChild(row)})}
async function showDetail(ref){try{const x=await api(`/api/runs/${run}/details/${ref}`);$("detailText").textContent=JSON.stringify(x.detail,null,2);$("detail").showModal()}catch(e){fail(e)}}
$("close").onclick=()=>$("detail").close();
</script>
</body>
</html>
